<style>
:root {
  --bg: #f8fafc; --c: #ffffff; --l: #e2e8f0; --t: #1e293b; --m: #64748b;

  box-sizing: border-box;
}
@media(prefers-color-scheme:dark){
  :root{ --bg: #0f172a; --c: #1e293b; --l: #334155; --t: #f8fafc; --m: #94a3b8; --p: #1d4ed8; --lg: #3b82f6; --ok: #16a34a; --bad: #dc2626; }
}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font-family:'Cairo',Tahoma,sans-serif;font-size:14px}
header{background:linear-gradient(135deg,var(--p),var(--lg));color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;box-shadow:0 4px 12px rgba(30,58,138,0.2)}
header b{font-size:18px;font-weight:700}
header button{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;margin-inline-start:8px;transition:background 0.2s}
header button:hover{background:rgba(255,255,255,0.25)}
nav{display:flex;gap:8px;padding:12px 20px;background:var(--c);border-bottom:1px solid var(--l);overflow-x:auto;box-shadow:0 2px 5px rgba(0,0,0,0.03)}
nav button{white-space:nowrap;background:none;border:1px solid var(--l);color:var(--t);border-radius:20px;padding:8px 16px;cursor:pointer;font:inherit;font-weight:600;transition:all 0.2s}
nav button:hover{border-color:var(--lg);color:var(--lg)}
nav button.on{background:var(--p);color:#fff;border-color:var(--p);box-shadow:0 3px 8px rgba(30,58,138,0.3)}
main{padding:20px;max-width:1200px;margin:0 auto}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 4px 6px rgba(0,0,0,0.02)}
.card h3{margin:0 0 15px;font-size:16px;color:var(--p);border-bottom:2px solid var(--l);padding-bottom:10px;font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:15px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--m);gap:6px;font-weight:600}
label.ck{flex-direction:row;align-items:center;gap:6px;color:var(--t)}
input,select{padding:10px 12px;border:1px solid var(--l);border-radius:8px;background:var(--bg);color:var(--t);font:inherit}
input:focus,select:focus{outline:none;border-color:var(--lg);background:var(--c)}
.b{background:linear-gradient(135deg,var(--p),var(--lg));color:#fff;border:none;border-radius:8px;padding:10px 20px;cursor:pointer;font:inherit;font-weight:600;margin-inline-end:8px}
.b-ok{background:linear-gradient(135deg,var(--ok),#166534);color:#fff}
.r{background:var(--c);border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;font-size:12px}
.r:hover{background:var(--bad);color:#fff}
.tw{overflow-x:auto;border:1px solid var(--l);border-radius:8px;background:var(--c)}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:12px 15px;border-bottom:1px solid var(--l);text-align:center;white-space:nowrap}
th{background:linear-gradient(135deg,var(--p),var(--lg));color:#fff;font-size:13px;font-weight:600}
tr:hover td{background:rgba(0,0,0,0.02)}
.tg{padding:4px 10px;border-radius:12px;font-size:11.5px;font-weight:600}
.tg.ok{background:#dcfce7;color:var(--ok)}
.tg.bad{background:#fee2e2;color:var(--bad)}
.lg{height:44px;border-radius:4px}.hl{display:flex;align-items:center;gap:10px}
#loading{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,0.95);display:flex;justify-content:center;align-items:center;z-index:999;font-size:18px;color:var(--p);flex-direction:column;gap:10px}
#loading .spinner{width:40px;height:40px;border:4px solid var(--l);border-top:4px solid var(--p);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@media print{header,nav,.np,.b,.r,#loading{display:none!important}.card{box-shadow:none;border:1px solid #ddd}body{background:#fff}}
</style>

const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fx=n=>String(Math.round(n*1000)/1000);
const it=id=>S.items.find(x=>x.id==id);
const stock=id=>S.moves.reduce((a,m)=>m.i==id?a+m.q:a,0);
const nm=id=>it(id)?E(it(id).name):t('delete');
const un=id=>it(id)?(LANG=="ar"?UN[it(id).u]:(it(id).u=="kg"?"kg":it(id).u=="g"?"g":it(id).u=="l"?"L":"unit")):"";
function daysLeft(ed){if(!ed)return null;return Math.round((new Date(ed)-new Date(today()))/864e5)}
function expBadge(ed){if(!ed)return "-";const d=daysLeft(ed);if(d<0)return `<span class="tg bad">${t('expired_since')} ${-d} ${t('day')}</span>`;if(d<=7)return `<span class="tg bad">${ed} — ${t('days_left')} ${d} ${t('day')}</span>`;if(d<=30)return `<span class="tg" style="background:#fff3cd;color:#8a6500">${ed} — ${t('days_left')} ${d} ${t('day')}</span>`;return `<span class="tg ok">${ed}</span>`}
function expBatches(){return S.moves.filter(m=>m.t=="in"&&m.ed).map(m=>({...m,dl:daysLeft(m.ed)})).sort((a,b)=>a.dl-b.dl)}
const cost=id=>{let q=0,v=0,l=0;S.moves.forEach(m=>{if(m.i==id&&m.t=="in"&&m.p>0){q+=m.q;v+=m.q*m.p;l=m.p}});return q?(S.cm=="last"?l:v/q):(it(id)?+it(id).p||0:0)};

const lineCost=l=>{
  const item=it(l.i);
  const baseCost=cost(l.i);
  const u = l.unit || (item ? item.u : 'kg');
  if(u === 'g') { return (l.q / 1000) * baseCost; }
  return l.q * baseCost;
};
const rcost=r=>r.lines.reduce((a,l)=>a+lineCost(l),0);

const $f=n=>(Math.round(n*100)/100).toLocaleString("en");
const clr=g=>g>=0?"var(--ok)":"var(--bad)";

const opts=w=>S.items.map(x=>`<option value="${x.id}">${E(x.name)} (${LANG=="ar"?UN[x.u]:(x.u=="kg"?"kg":x.u=="g"?"g":x.u=="l"?"L":"unit")})${w?" — "+t('balance')+" "+fx(stock(x.id)):""}</option>`).join("");

function mv(i,t,q,n,d,p){S.moves.push({i:+i,d:d||today(),t,q,n:n||"",b:"Admin",p:p||0}); save();}

function saveRecipe(){const name=($("r_n").value||tmpN).trim(),price=+($("r_p").value||tmpP)||0;if(!name||!tmpRecipe.length){alert(t('add_at_least_one'));return}S.recipes.push({id:S.seq++,name,price,lines:[...tmpRecipe]});tmpRecipe=[];tmpN="";tmpP="";save();go();}

function addMenu(){const rid=+$("m_r").value,q=+$("m_q").value;if(!rid||!(q>0))return;if(!S.menu[md])S.menu[md]=[];const ex=S.menu[md].find(x=>x.rid==rid);if(ex)ex.q+=q;else S.menu[md].push({rid,q});save();go();}
function vMenuTable(){const list=S.menu[md]||[];if(!list.length)return `<p style="color:var(--m)">${t('no_data')}</p>`;let totC=0,totR=0;const itemsNeeded={};list.forEach(m=>{const r=S.recipes.find(x=>x.id==m.rid);if(!r)return;totC+=rcost(r)*m.q;totR+=r.price*m.q;r.lines.forEach(l=>{const u=l.unit||(it(l.i)?it(l.i).u:'kg');const reqQty=(u==='g')?(l.q/1000)*m.q:l.q*m.q;itemsNeeded[l.i]=(itemsNeeded[l.i]||0)+reqQty;});});const needRows=Object.keys(itemsNeeded).map(id=>{const req=itemsNeeded[id],st=stock(id),c=cost(id),diff=st-req,short=diff<0?-diff:0;return[nm(id),fx(req),un(id),$f(req*c),fx(st),short>0?`<b style="color:var(--bad)">${fx(short)}</b>`:"0",short>0?`<span class="tg bad">${t('needs_purchase')}</span>`:`<span class="tg ok">${t('sufficient')}</span>`];});return `<h4>${t('dishes')}</h4>${tbl([t('dish'),t('portions'),t('portion_cost'),t('total'),t('action')],list.map((m,idx)=>{const r=S.recipes.find(x=>x.id==m.rid)||{};return[E(r.name||""),m.q,$f(rcost(r)),$f(rcost(r)*m.q),`<button class="r" onclick="S.menu['${md}'].splice(${idx},1);save();go()">${t('delete')}</button>`];}))}<div style="margin:15px 0"><b>${t('expected_cost')}: ${$f(totC)} | ${t('expected_revenue')}: ${$f(totR)} | ${t('expected_profit')}: <span style="color:${clr(totR-totC)}">${$f(totR-totC)}</span></b></div><h4>${t('store_needs')}</h4>${tbl([t('item'),t('required'),t('unit'),t('required_value'),t('available_s'),t('shortage'),t('status')],needRows)}<div style="margin-top:15px"><button class="b b-ok" onclick="issueMenu('${md}')">${t('issue_needs')}</button></div>`;}
function issueMenu(d){const list=S.menu[d]||[];if(!list.length)return;if(S.done[d]&&!confirm(t('menu_already_issued')))return;list.forEach(m=>{const r=S.recipes.find(x=>x.id==m.rid);if(!r)return;r.lines.forEach(l=>{const u=l.unit||(it(l.i)?it(l.i).u:'kg');const reqQty=(u==='g')?(l.q/1000)*m.q:l.q*m.q;S.moves.push({i:l.i,d,t:"out",q:-reqQty,r:`منيو ${d}: ${r.name}`,b:"Admin"});});});S.done[d]=true;save();alert(t('issue_confirm'));go();}

function doSale(){const rid=+$("sa_r").value,q=+$("sa_q").value;if(!rid||!(q>0))return;const r=S.recipes.find(x=>x.id==rid);if(!r)return;const p=$("sa_p").value!==""?+$("sa_p").value:r.price;const c=rcost(r)*q,ded=$("sa_ded").checked;if(ded){for(let l of r.lines){const u=l.unit||(it(l.i)?it(l.i).u:'kg');const reqQty=(u==='g')?(l.q/1000)*q:l.q*q;if(reqQty>stock(l.i)){alert(`${t('qty_exceeds_balance')}: ${nm(l.i)}`);return}}r.lines.forEach(l=>{const u=l.unit||(it(l.i)?it(l.i).u:'kg');const reqQty=(u==='g')?(l.q/1000)*q:l.q*q;S.moves.push({i:l.i,d:today(),t:"out",q:-reqQty,r:`بيع: ${r.name}`,b:"Admin"});});}S.sales.push({id:S.seq++,d:today(),rid,rn:r.name,q,p,tot:p*q,cost:c,b:"Admin"});save();go();}

function vEmp(){const depts=[...new Set(S.employees.map(e=>e.dept).filter(Boolean))];const curMonth=today().slice(0,7);const selectedMonth=$("emp_m_select")?$("emp_m_select").value:curMonth;const selectedDept=$("emp_d_select")?$("emp_d_select").value:"all";let filteredEmps=S.employees;if(selectedDept!=="all")filteredEmps=filteredEmps.filter(e=>e.dept===selectedDept);const empMonthlyTotals={};S.emp_meals.filter(m=>m.d.startsWith(selectedMonth)).forEach(m=>{empMonthlyTotals[m.emp_id]=(empMonthlyTotals[m.emp_id]||0)+m.tot;});return `

  </div><button class="b b-ok" onclick="logEmpMeal()">${t('save_meal_log')}</button></div>

    ${tbl([t('emp_name'),t('emp_dept'),`${t('emp_monthly_total')} (${selectedMonth})`,t('action')],filteredEmps.map(e=>[E(e.name),E(e.dept||"-"),`<b>${$f(empMonthlyTotals[e.id]||0)}</b>`,`<button class="b" onclick="quickLogMeal(${e.id})">${t('log_meal_btn')}</button> <button class="r" onclick="delEmp(${e.id})">${t('delete')}</button>`]))}

    ${tbl([t('payment_date'),t('emp_name'),t('emp_dept'),t('meals_count'),t('price_per_meal'),t('total_deduction'),t('note'),t('user'),t('action')],S.emp_meals.slice(-20).reverse().map(m=>{const emp=S.employees.find(e=>e.id==m.emp_id)||{};return[m.d,E(emp.name||"-"),E(emp.dept||"-"),m.q,$f(m.p),`<b>${$f(m.tot)}</b>`,E(m.n||"-"),E(m.b||"-"),`<button class="r" onclick="delEmpMeal(${m.id})">${t('delete')}</button>`];}))}

function optsEmp(){return S.employees.map(e=>`<option value="${e.id}">${E(e.name)} ${e.dept?`(${E(e.dept)})`:""}</option>`).join("");}
function filterEmpSelect(){const q=$("emp_search").value.toLowerCase().trim();const sel=$("m_emp_id");const filtered=S.employees.filter(e=>e.name.toLowerCase().includes(q)||(e.dept&&e.dept.toLowerCase().includes(q)));sel.innerHTML=filtered.map(e=>`<option value="${e.id}">${E(e.name)} ${e.dept?`(${E(e.dept)})`:""}</option>`).join("");}
function calcMealTot(){const q=+$("m_emp_q").value||0,p=+$("m_emp_p").value||0;$("m_emp_tot").value=q*p;}
function addEmp(){const name=$("e_n").value.trim(),dept=$("e_d").value.trim();if(!name){alert(t('enter_item_name'));return}if(S.employees.some(e=>e.name.toLowerCase()===name.toLowerCase())){alert(t('emp_exists'));return}S.employees.push({id:S.seq++,name,dept});save();go();}
function delEmp(id){if(S.emp_meals.some(m=>m.emp_id==id)){if(!confirm(t('confirm_delete')))return}S.employees=S.employees.filter(e=>e.id!=id);S.emp_meals=S.emp_meals.filter(m=>m.emp_id!=id);save();go();}
function logEmpMeal(){const emp_id=+$("m_emp_id").value,d=$("m_emp_d").value,q=+$("m_emp_q").value,p=+$("m_emp_p").value,tot=+$("m_emp_tot").value,n=$("m_emp_n").value.trim();if(!emp_id||!(q>0)){alert(t('enter_valid_qty'));return}S.emp_meals.push({id:S.seq++,emp_id,d,q,p,tot,n,b:"Admin"});save();go();}
function quickLogMeal(emp_id){const emp=S.employees.find(e=>e.id==emp_id);if(!emp)return;const q=prompt(`${t('log_meal_for')} ${emp.name}:\n${t('meals_count')}`,"1");if(!q||!(+q>0))return;const p=prompt(t('price_per_meal'),"50");if(!p||!(+p>=0))return;S.emp_meals.push({id:S.seq++,emp_id,d:today(),q:+q,p:+p,tot:(+q)*(+p),n:"",b:"Admin"});save();go();}
function delEmpMeal(id){if(confirm(t('confirm_delete'))){S.emp_meals=S.emp_meals.filter(m=>m.id!=id);save();go();}}
function importEmpXlsx(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=new Uint8Array(e.target.result);const wb=XLSX.read(data,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1});let imported=0;for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||!r[0])continue;const name=String(r[0]).trim(),dept=r[1]?String(r[1]).trim():"";if(name&&!S.employees.some(e=>e.name.toLowerCase()===name.toLowerCase())){S.employees.push({id:S.seq++,name,dept});imported++;}}save();alert(`${t('emp_imported')} ${imported} ${t('emp_new')}`);go();}catch(err){alert("Error: "+err.message)}};reader.readAsArrayBuffer(file);}
function downloadEmpTemplate(){const data=[["اسم الموظف","الإدارة / القسم"],["أحمد محمد","المطبخ"],["سارة علي","الصيانة"]];const ws=XLSX.utils.aoa_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Employees");XLSX.writeFile(wb,"employees_template.xlsx");}
function exportEmpReport(month){const filteredMeals=S.emp_meals.filter(m=>m.d.startsWith(month));const rows=[["التاريخ","اسم الموظف","الإدارة","عدد الوجبات","سعر الوجبة","إجمالي الخصم","ملاحظات","المستخدم"]];filteredMeals.forEach(m=>{const emp=S.employees.find(e=>e.id==m.emp_id)||{};rows.push([m.d,emp.name||"",emp.dept||"",m.q,m.p,m.tot,m.n||"",m.b||""]);});const ws=XLSX.utils.aoa_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Meal_Deductions");XLSX.writeFile(wb,`meal_deductions_${month}.xlsx`);}

function vRep(){return `<div class="card np"><h3>${t('report_type')}</h3><div class="g">
  <label>${t('report_type')}<select id="r_t" onchange="rt=this.value;go()">
    <option value="items">${t('rep_items')}</option>
    <option value="in">${t('rep_in')}</option>
    <option value="out">${t('rep_out')}</option>
    <option value="sales">${t('rep_sales')}</option>
    <option value="sup">${t('rep_sup')}</option>
    <option value="menu">${t('rep_menu')}</option>

    <option value="count">${t('rep_count')}</option>
  </select></label>

  <label>${t('to_date')}<input id="r_to" type="date" value="${rto}" onchange="rto=this.value"></label></div>
  <button class="b" onclick="go()">${t('generate_report')}</button> <button class="b" onclick="window.print()">${t('print')}</button></div>
  <div class="card">${genRep()}</div>`;}

function genRep(){
  const filterDate=(arr)=>{let res=[...arr];if(rf)res=res.filter(x=>x.d>=rf);if(rto)res=res.filter(x=>x.d<=rto);return res;};
  if(rt=="items")return tbl([t('item'),t('category_s'),t('unit'),t('balance'),t('avg_price'),t('balance_value'),t('min_limit_s')],S.items.map(x=>{const st=stock(x.id),c=cost(x.id);return[E(x.name),E(x.c),LANG=="ar"?UN[x.u]:x.u,fx(st),$f(c),$f(st*c),x.m||0]}));
  if(rt=="in"){const list=filterDate(S.moves.filter(m=>m.t=="in"));return tbl([t('supply_date'),t('item'),t('qty'),t('unit_price_s'),t('total'),t('supplier'),t('invoice_no')],list.map(m=>[m.d,nm(m.i),fx(m.q),$f(m.p),$f(m.q*m.p),E((S.sup.find(s=>s.id==m.sid)||{}).n||"-"),E(m.inv||"-")]));}
  if(rt=="out"){const list=filterDate(S.moves.filter(m=>m.t=="out"));return tbl([t('payment_date'),t('item'),t('qty'),t('receiving_party'),t('note'),t('user')],list.map(m=>[m.d,nm(m.i),fx(Math.abs(m.q)),E(m.r||"-"),E(m.n||"-"),E(m.b||"-")]));}
  if(rt=="sales"){const list=filterDate(S.sales);const rev=list.reduce((a,s)=>a+s.tot,0),cst=list.reduce((a,s)=>a+s.cost,0);return `<p><b>${t('revenue')}: ${$f(rev)} | ${t('cost')}: ${$f(cst)} | ${t('net')}: <span style="color:${clr(rev-cst)}">${$f(rev-cst)}</span></b></p>`+tbl([t('payment_date'),t('dish'),t('qty_s'),t('meal_price'),t('total'),t('cost'),t('net')],list.map(s=>[s.d,E(s.rn),s.q,$f(s.p),$f(s.tot),$f(s.cost),`<b style="color:${clr(s.tot-s.cost)}">${$f(s.tot-s.cost)}</b>`]));}
  if(rt=="sup")return tbl([t('supplier_name'),t('total_purchases'),t('paid'),t('due')],S.sup.map(s=>{const pur=S.moves.filter(m=>m.t=="in"&&m.sid==s.id).reduce((a,m)=>a+m.q*m.p,0);const pd=S.pay.filter(p=>p.sid==s.id).reduce((a,p)=>a+p.a,0);return[E(s.n),$f(pur),$f(pd),`<b style="color:${clr(pd-pur)}">${$f(pur-pd)}</b>`];}));
  if(rt=="menu"){const menuDates=Object.keys(S.menu).sort();const filteredDates=menuDates.filter(d=>(!rf||d>=rf)&&(!rto||d<=rto));let rows=[],totalCost=0,totalRev=0;filteredDates.forEach(d=>{S.menu[d].forEach(m=>{const r=S.recipes.find(x=>x.id==m.rid);if(!r)return;const c=rcost(r)*m.q;const rev=r.price*m.q;totalCost+=c;totalRev+=rev;rows.push([d,E(r.name),m.q,$f(rcost(r)),$f(c),$f(rev),`<b style="color:${clr(rev-c)}">${$f(rev-c)}</b>`]);});});return `<p><b>${t('expected_cost')}: ${$f(totalCost)} | ${t('expected_revenue')}: ${$f(totalRev)} | ${t('expected_profit')}: <span style="color:${clr(totalRev-totalCost)}">${$f(totalRev-totalCost)}</span></b></p>`+tbl([t('menu_date'),t('dish'),t('portions'),t('portion_cost'),t('cost'),t('revenue'),t('net')],rows);}
  if(rt=="emp"){const list=filterDate(S.emp_meals);let rows=[],totalDed=0;list.forEach(m=>{const emp=S.employees.find(e=>e.id==m.emp_id)||{};totalDed+=m.tot;rows.push([m.d,E(emp.name||"-"),E(emp.dept||"-"),m.q,$f(m.p),`<b>${$f(m.tot)}</b>`,E(m.n||"-")]);});return `<p><b>${t('total_deduction')}: ${$f(totalDed)}</b></p>`+tbl([t('payment_date'),t('emp_name'),t('emp_dept'),t('meals_count'),t('price_per_meal'),t('total_deduction'),t('note')],rows);}
  if(rt=="count"){const list=filterDate(S.moves.filter(m=>m.t=="adj"));return tbl([t('payment_date'),t('item'),t('qty'),t('note'),t('user')],list.map(m=>[m.d,nm(m.i),fx(m.q),E(m.n||"-"),E(m.b||"-")]));}
  return "";
}

function loadCat(){if(!confirm(t('confirm_load_prices')))return;const market=[{n:"طماطم",c:"خضروات",u:"kg",p:5},{n:"بصل",c:"خضروات",u:"kg",p:4},{n:"دجاج",c:"دواجن",u:"kg",p:65},{n:"أرز",c:"بقالة",u:"kg",p:35},{n:"زيت",c:"زيوت",u:"l",p:45}];let added=0,updated=0;market.forEach(m=>{const ex=S.items.find(x=>x.name===m.n);if(ex){ex.p=m.p;updated++}else{S.items.push({id:S.seq++,name:m.n,c:m.c,u:m.u,p:m.p,m:5});added++;}});save();alert(`${t('added')}: ${added}, ${t('updated')}: ${updated}`);go();}
function xlsxTemplate(){const data=[[t('item_name'),t('category'),t('unit_price'),t('qty_type'),t('min_limit')],["طماطم","خضروات",5,"kg",10],["أرز","بقالة",35,"kg",20]];const ws=XLSX.utils.aoa_to_sheet(data);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Items");XLSX.writeFile(wb,"items_template.xlsx");}
function importXlsx(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const data=new Uint8Array(e.target.result);const wb=XLSX.read(data,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{header:1});let added=0;for(let i=1;i<rows.length;i++){const r=rows[i];if(!r||!r[0])continue;const name=String(r[0]).trim(),c=String(r[1]||"أخرى").trim(),p=+r[2]||0,u=String(r[3]||"kg").trim(),m=+r[4]||0;if(name&&!S.items.some(x=>x.name.toLowerCase()===name.toLowerCase())){S.items.push({id:S.seq++,name,c,u,p,m});added++;}}save();alert(`${t('added')}: ${added}`);go();}catch(err){alert("Error: "+err.message)}};reader.readAsArrayBuffer(file);}

function go(){const nav=$("nav");nav.innerHTML=TABS.map(([k,label,ar])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';go()">${LANG=="ar"?label:ar}</button>`).join("");const view=$("view");if(tab=="items")view.innerHTML=vItems();else if(tab=="in")view.innerHTML=vIn();else if(tab=="sup")view.innerHTML=vSup();else if(tab=="out")view.innerHTML=vOut();else if(tab=="menu")view.innerHTML=vMenu();else if(tab=="sales")view.innerHTML=vSales();else if(tab=="emp")view.innerHTML=vEmp();else if(tab=="count")view.innerHTML=vCount();else if(tab=="rep")view.innerHTML=vRep();}

// ========== تشغيل النظام السحابي ==========
db.collection('kitchen_data').doc('main').onSnapshot((doc) => {
  if (doc.exists) {
    const cloudData = doc.data();
    S = {
      items: cloudData.items || [],
      moves: cloudData.moves || [],
      recipes: cloudData.recipes || [],
      employees: cloudData.employees || [],
      emp_meals: cloudData.emp_meals || [],
      sales: cloudData.sales || [],
      sup: cloudData.sup || [],
      pay: cloudData.pay || [],
      menu: cloudData.menu || {},
      done: cloudData.done || {},
      seq: cloudData.seq || 1,
      cm: cloudData.cm || "avg",
      cats: cloudData.cats || defaultS.cats
    };
    try { localStorage.setItem(K, JSON.stringify(S)); } catch(e){}
    $("loading").style.display = "none";
    $("app").style.display = "block";
    applyLang();
    go();
  } else {
    S = JSON.parse(JSON.stringify(defaultS));
    save();
  }
}, (error) => {
  console.error("Firestore error:", error);
  $("loading").innerHTML = "❌ خطأ في الاتصال: " + error.message;
});
</script>
