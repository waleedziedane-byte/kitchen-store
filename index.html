function tbl(h, r) {
  var html = '<div class="tw"><table><thead><tr>';
  h.forEach(function(x) { html += '<th>' + x + '</th>'; });
  html += '</tr></thead><tbody>';
  if (r.length) {
    r.forEach(function(a) {
      html += '<tr>';
      a.forEach(function(c) { html += '<td>' + c + '</td>'; });
      html += '</tr>';
    });
  } else {
    html += '<tr><td colspan="' + h.length + '">لا توجد بيانات</td></tr>';
  }
  html += '</tbody></table></div>';
  return html;
}

function opts(w) {
  return S.items.map(function(x) { return '<option value="' + x.id + '">' + E(x.name) + ' (' + UN[x.u] + ')' + (w ? ' — ' + fx(stock(x.id)) : '') + '</option>'; }).join("");
}

var save = function() {
  try { localStorage.setItem("kitchen_v1", JSON.stringify(S)); } catch(e) {}
  db.collection('kitchen_data').doc('main').set(S).catch(function(e) { console.error('Save error:', e); });
};

function hasPerm(section, permType) {
  if (!userPermissions) return false;
  var sectionPerms = userPermissions[section];
  if (!sectionPerms) return false;
  return sectionPerms[permType] === true;
}

function getVisibleTabs() {
  var tabs = [];
  var allTabs = [["items","الأصناف"],["in","الوارد"],["sup","الموردون"],["out","الصرف"],["menu","المنيو"],["sales","المبيعات"],["emp","الموظفين"],["count","الجرد"],["rep","التقارير"],["log","سجل الحركات"]];
  allTabs.forEach(function(t) { if (hasPerm(t[0], 'view')) tabs.push(t); });
  return tabs;
}

var logAction = function(action, details, extra) {
  extra = extra || {};
  var now = new Date();
  var entry = { action: action, details: details, user: currentUser ? currentUser.name : "غير معروف", userEmail: currentUser ? currentUser.email : "unknown", userRole: currentRole || "unknown", date: now.toISOString().slice(0, 10), time: now.toLocaleTimeString('ar-EG', {hour12: false}), timestamp: Date.now() };
  var key;
  for (key in extra) { entry[key] = extra[key]; }
  db.collection('audit_log').add(entry).catch(function(e) { console.error('Log error:', e); });
};

function toggleLoginMode() {
  loginMode = loginMode === "login" ? "register" : "login";
  $("loginBtn").textContent = loginMode === "login" ? "تسجيل الدخول" : "إنشاء حساب";
  $("switchText").textContent = loginMode === "login" ? "ليس لديك حساب؟" : "لديك حساب بالفعل؟";
  $("switchLink").textContent = loginMode === "login" ? "إنشاء حساب جديد" : "تسجيل الدخول";
  $("loginError").style.display = "none";
}

var doLogin = function() {
  var email = $("loginEmail").value.trim();
  var pass = $("loginPass").value;
  if (!email || !pass) { $("loginError").textContent = "أدخل البريد وكلمة المرور"; $("loginError").style.display = "block"; return; }
  $("loginBtn").disabled = true; $("loginBtn").textContent = "جاري...";
  if (loginMode === "login") {
    auth.signInWithEmailAndPassword(email, pass).then(function(cred) {
      return loadUserData(cred.user.uid);
    }).catch(function(e) {
      var errors = { 'auth/user-not-found': 'البريد غير مسجل', 'auth/wrong-password': 'كلمة المرور خاطئة', 'auth/invalid-email': 'بريد غير صحيح' };
      $("loginError").textContent = errors[e.code] || e.message;
      $("loginError").style.display = "block";
    }).finally(function() { $("loginBtn").disabled = false; $("loginBtn").textContent = "تسجيل الدخول"; });
  } else {
    auth.createUserWithEmailAndPassword(email, pass).then(function(cred) {
      return db.collection('users').doc(cred.user.uid).set({ email: email, name: email.split('@')[0], role: 'viewer', status: 'pending', permissions: JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS.viewer)), createdAt: new Date().toISOString() });
    }).then(function() {
      $("loginError").textContent = "تم إنشاء الحساب. بانتظار موافقة المدير.";
      $("loginError").style.display = "block";
      return auth.signOut();
    }).then(function() { toggleLoginMode(); }).catch(function(e) {
      var errors = { 'auth/email-already-in-use': 'البريد مستخدم', 'auth/weak-password': 'كلمة المرور ضعيفة (6 أحرف)', 'auth/invalid-email': 'بريد غير صحيح' };
      $("loginError").textContent = errors[e.code] || e.message;
      $("loginError").style.display = "block";
    }).finally(function() { $("loginBtn").disabled = false; $("loginBtn").textContent = "إنشاء حساب"; });
  }
};

var loadUserData = function(uid) {
  return db.collection('users').doc(uid).get().then(function(userDoc) {
    if (!userDoc.exists) {
      var adminPerms = JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS.admin));
      return db.collection('users').doc(uid).set({ email: auth.currentUser.email, name: auth.currentUser.email.split('@')[0], role: 'admin', status: 'active', permissions: adminPerms, createdAt: new Date().toISOString() }).then(function() {
        currentUser = { uid: uid, email: auth.currentUser.email, name: auth.currentUser.email.split('@')[0], role: 'admin', status: 'active' };
        userPermissions = adminPerms;
      });
    } else {
      var data = userDoc.data();
      if (data.status === 'pending') { $("loginError").textContent = "حسابك بانتظار موافقة المدير"; $("loginError").style.display = "block"; return auth.signOut(); }
      if (data.status === 'blocked') { $("loginError").textContent = "تم إيقاف حسابك"; $("loginError").style.display = "block"; return auth.signOut(); }
      currentUser = { uid: uid };
      var key;
      for (key in data) { currentUser[key] = data[key]; }
      userPermissions = data.permissions || JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS[data.role] || DEFAULT_ROLE_PERMS.viewer));
    }
  }).catch(function(e) {
    console.error("خطأ في تحميل المستخدم:", e);
    currentUser = { uid: uid, email: auth.currentUser.email, name: "مدير", role: 'admin', status: 'active' };
    userPermissions = JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS.admin));
  }).then(function() {
    currentRole = currentUser.role || 'admin';
    $("loginScreen").style.display = "none"; $("loading").style.display = "flex";
    $("usersBtn").style.display = hasPerm('users', 'view') ? 'inline-block' : 'none';
    $("who").textContent = (currentUser.name || 'مدير') + ' (' + (ROLES[currentRole].name || 'مدير') + ')';
    return ensureDataExists();
  }).then(function() {
    loadAppData();
    loadLogs();
  });
};

var ensureDataExists = function() {
  return db.collection('kitchen_data').doc('main').get().then(function(doc) {
    if (!doc.exists) { return db.collection('kitchen_data').doc('main').set(defaultS); }
  }).catch(function(e) { console.error('ensureData error:', e); });
};

function loadAppData() {
  db.collection('kitchen_data').doc('main').onSnapshot(function(doc) {
    if (doc.exists) {
      var d = doc.data();
      S = { items: d.items || [], moves: d.moves || [], recipes: d.recipes || [], employees: d.employees || [], emp_meals: d.emp_meals || [], sales: d.sales || [], sup: d.sup || [], pay: d.pay || [], menu: d.menu || {}, done: d.done || {}, seq: d.seq || 1, cm: d.cm || "avg", cats: d.cats || defaultS.cats };
      $("loading").style.display = "none"; $("app").style.display = "block";
      try { go(); } catch(e) { console.error('go error:', e); }
    }
  }, function(error) { console.error('Snapshot error:', error); $("loading").innerHTML = "خطأ: " + error.message; });
}

function loadLogs() {
  db.collection('audit_log').orderBy('timestamp', 'desc').limit(500).onSnapshot(function(snap) {
    allLogs = snap.docs.map(function(d) { return d.data(); });
    if (tab === 'log') go();
  }, function(error) { console.error('Logs error:', error); });
}

var doLogout = function() {
  logAction("تسجيل خروج", "خروج: " + (currentUser ? currentUser.email : ''));
  if (confirm("تسجيل الخروج؟")) { auth.signOut().then(function() { location.reload(); }); }
};

function go() {
  try {
    var visibleTabs = getVisibleTabs();
    var found = false;
    for (var i = 0; i < visibleTabs.length; i++) { if (visibleTabs[i][0] === tab) { found = true; break; } }
    if (!found) tab = visibleTabs.length > 0 ? visibleTabs[0][0] : "rep";
    var navEl = $("nav"); if (!navEl) return;
    navEl.innerHTML = visibleTabs.map(function(t) { return '<button class="' + (tab==t[0]?'on':'') + '" onclick="tab=\'' + t[0] + '\';go()">' + t[1] + '</button>'; }).join("");
    var viewEl = $("view"); if (!viewEl) return;
    if (tab == "items") viewEl.innerHTML = vItems();
    else if (tab == "in") viewEl.innerHTML = vIn();
    else if (tab == "sup") viewEl.innerHTML = vSup();
    else if (tab == "out") viewEl.innerHTML = vOut();
    else if (tab == "menu") viewEl.innerHTML = vMenu();
    else if (tab == "sales") viewEl.innerHTML = vSales();
    else if (tab == "emp") viewEl.innerHTML = vEmp();
    else if (tab == "count") viewEl.innerHTML = vCount();
    else if (tab == "rep") viewEl.innerHTML = vRep();
    else if (tab == "log") viewEl.innerHTML = vLog();
    else viewEl.innerHTML = '<div class="card">مرحباً بك في النظام</div>';
  } catch(e) { console.error('go() error:', e); var viewEl = $("view"); if (viewEl) viewEl.innerHTML = '<div class="card"><h3>خطأ</h3><p>' + e.message + '</p><button class="b" onclick="go()">إعادة المحاولة</button></div>'; }
}

// ===== الأصناف =====
function vItems() {
  if (!hasPerm('items', 'view')) return '<div class="card">لا تملك صلاحية مشاهدة الأصناف</div>';
  var catsList = [];
  var seen = {};
  S.cats.forEach(function(c) { if (!seen[c]) { seen[c] = true; catsList.push(c); } });
  S.items.forEach(function(x) { if (!seen[x.c]) { seen[x.c] = true; catsList.push(x.c); } });
  
  var editForm = '';
  if (editingItemId !== null) {
    var item = S.items.find(function(x) { return x.id == editingItemId; });
    if (item) {
      editForm = '<div class="card" style="background:#fef3c7"><h3>تعديل الصنف: ' + E(item.name) + '</h3><div class="g">' +
        '<label>الاسم<input id="edit_item_name" value="' + E(item.name) + '"></label>' +
        '<label>التصنيف<select id="edit_item_cat">' + catsList.map(function(c) { return '<option ' + (c===item.c?'selected':'') + '>' + E(c) + '</option>'; }).join("") + '</select></label>' +
        '<label>الوحدة<select id="edit_item_u" onchange="toggleEditQtyField()"><option value="kg" ' + (item.u==='kg'?'selected':'') + '>كجم</option><option value="g" ' + (item.u==='g'?'selected':'') + '>جرام</option><option value="l" ' + (item.u==='l'?'selected':'') + '>لتر</option><option value="u" ' + (item.u==='u'?'selected':'') + '>وحدة</option></select></label>' +
        '<label id="editQtyLabel" class="' + (item.u==='u'?'hidden':'') + '">الكمية<input id="edit_item_qty" type="number" step="any" value="' + (item.qty||0) + '"></label>' +
        '<label id="editCountLabel" class="' + (item.u!=='u'?'hidden':'') + '">العدد<input id="edit_item_count" type="number" step="1" value="' + (item.qty||0) + '"></label>' +
        '<label>السعر<input id="edit_item_p" type="number" step="any" value="' + item.p + '"></label>' +
        '<label>حد الطلب<input id="edit_item_m" type="number" value="' + (item.m||0) + '"></label>' +
        '</div><button class="b b-ok" onclick="saveEditItem(' + item.id + ')">حفظ التعديل</button> <button class="r" onclick="cancelEditItem()">إلغاء</button></div>';
    }
  }
  
  var toolbar = '<div class="toolbar">';
  if (hasPerm('items','create')) toolbar += '<button class="b" onclick="showAddItemForm()">+ إضافة صنف</button>';
  if (hasPerm('items','import')) toolbar += '<button class="b-purple" onclick="showMarketImport()">استيراد من السوق (' + MARKET_PRICES.length + ')</button>';
  if (hasPerm('items','import')) toolbar += '<div class="file-input-wrapper"><button class="b-info">استيراد إكسل</button><input type="file" accept=".xlsx,.xls" onchange="importItemsExcel(this)"></div>';
  if (hasPerm('items','export')) toolbar += '<button class="b-ok" onclick="exportItems()">تصدير إكسل</button>';
  toolbar += '</div>';
  
  var addForm = '';
  if (hasPerm('items','create')) {
    addForm = '<div class="card"><h3>إضافة صنف جديد</h3><div class="g">' +
      '<label>اسم الصنف<input id="a_n"></label>' +
      '<label>التصنيف<select id="a_c">' + catsList.map(function(c) { return '<option>' + E(c) + '</option>'; }).join("") + '</select></label>' +
      '<label>سعر الوحدة<input id="a_p" type="number" value="0"></label>' +
      '<label>الوحدة<select id="a_u" onchange="toggleQtyField()"><option value="kg">كجم</option><option value="g">جرام</option><option value="l">لتر</option><option value="u">وحدة (عدد)</option></select></label>' +
      '<label id="qtyLabel">الكمية<input id="a_qty" type="number" step="any" value="0"></label>' +
      '<label id="countLabel" class="hidden">العدد<input id="a_count" type="number" step="1" value="0"></label>' +
      '<label>حد الطلب<input id="a_m" type="number" value="0"></label>' +
      '</div><button class="b" onclick="addItem()">إضافة</button></div>';
  }
  
  var itemsTable = tbl(['الصنف','التصنيف','الوحدة','الرصيد/العدد','السعر','القيمة','الحالة','إجراء'], S.items.map(function(x) {
    var st = stock(x.id), c = cost(x.id), f = x.m > 0 && st < x.m;
    var actions = '';
    if (hasPerm('items','edit')) actions += '<button class="btn-edit" onclick="editItem(' + x.id + ')">تعديل</button>';
    if (hasPerm('items','delete')) actions += '<button class="btn-del" onclick="delItem(' + x.id + ')">حذف</button>';
    return [E(x.name), E(x.c), UN[x.u], fx(st), $f(c), $f(st * c), f ? '<span class="tg bad">منخفض</span>' : '<span class="tg ok">متوفر</span>', actions || '-'];

  return editForm + toolbar + addForm + '<div class="card"><h3>الأصناف والأرصدة (' + S.items.length + ')</h3>' + itemsTable + '</div>';

function showMarketImport() {
  if (!hasPerm('items','import')) return;
  var existingNames = {};
  S.items.forEach(function(x) { existingNames[x.name.toLowerCase()] = true; });
  var newItems = MARKET_PRICES.filter(function(p) { return !existingNames[p.name.toLowerCase()]; });
  
  var previewHtml = '<div class="card" style="background:#f0fdf4"><h3>استيراد ' + newItems.length + ' صنف من أسعار السوق</h3>' +
    '<p style="color:#166534;margin-bottom:10px">سيتم إضافة الأصناف التالية. يمكنك تعديل الكمية والسعر بعد الاستيراد.</p>' +
    '<div style="max-height:300px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin:10px 0;background:#fff">';
  
  newItems.slice(0, 50).forEach(function(p) {
    previewHtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px solid #e2e8f0;font-size:13px"><span>' + E(p.name) + ' - ' + p.cat + '</span><span>' + UN[p.u] + ' - ' + $f(p.p) + ' ج.م</span></div>';
  });
  if (newItems.length > 50) previewHtml += '<div style="padding:6px;font-size:13px">... و ' + (newItems.length - 50) + ' صنف آخر</div>';
  previewHtml += '</div><div style="margin-top:15px">' +
    '<button class="b b-ok" onclick="confirmMarketImport()">تأكيد الاستيراد (' + newItems.length + ' صنف)</button>' +
    '<button class="r" onclick="go()">إلغاء</button></div></div>';
  
  $("view").innerHTML = previewHtml;
}

function confirmMarketImport() {
  var existingNames = {};
  S.items.forEach(function(x) { existingNames[x.name.toLowerCase()] = true; });
  var newItems = MARKET_PRICES.filter(function(p) { return !existingNames[p.name.toLowerCase()]; });
  var added = 0;
  newItems.forEach(function(p) {
    S.items.push({id: S.seq++, name: p.name, c: p.cat, u: p.u, p: p.p, m: 5, qty: 0});
    added++;
  });
  save();
  logAction("استيراد من السوق", "استيراد " + added + " صنف من أسعار السوق", {count: added});
  alert("تم استيراد " + added + " صنف من أسعار السوق!");
  go();
}

function toggleQtyField() {
  var unit = $("a_u").value;
  if (unit === 'u') { $("qtyLabel").classList.add('hidden'); $("countLabel").classList.remove('hidden'); }
  else { $("qtyLabel").classList.remove('hidden'); $("countLabel").classList.add('hidden'); }
}

function toggleEditQtyField() {
  var unit = $("edit_item_u").value;
  if (unit === 'u') { $("editQtyLabel").classList.add('hidden'); $("editCountLabel").classList.remove('hidden'); }
  else { $("editQtyLabel").classList.remove('hidden'); $("editCountLabel").classList.add('hidden'); }
}

function showAddItemForm() { window.scrollTo({top: 0, behavior: 'smooth'}); if ($("a_n")) $("a_n").focus(); }

function addItem() {
  if (!hasPerm('items','create')) { alert("لا تملك صلاحية الإضافة"); return; }
  var n = $("a_n").value.trim(); if (!n) { alert("أدخل الاسم"); return; }
  var unit = $("a_u").value;
  var qty = unit === 'u' ? (+$("a_count").value || 0) : (+$("a_qty").value || 0);
  S.items.push({id: S.seq++, name: n, c: $("a_c").value, u: unit, p: +$("a_p").value || 0, m: +$("a_m").value || 0, qty: qty});
  save(); logAction("إضافة صنف", "إضافة: " + n, {itemName: n}); go();
}

function editItem(id) {
  if (!hasPerm('items','edit')) { alert("لا تملك صلاحية التعديل"); return; }
  editingItemId = id; go(); window.scrollTo({top: 0, behavior: 'smooth'});
}

function cancelEditItem() { editingItemId = null; go(); }

var saveEditItem = function(id) {
  var item = S.items.find(function(x) { return x.id == id; }); if (!item) return;
  var newName = $("edit_item_name").value.trim(); if (!newName) { alert("الاسم مطلوب"); return; }
  var oldName = item.name;
  item.name = newName; item.c = $("edit_item_cat").value; item.u = $("edit_item_u").value;
  item.qty = item.u === 'u' ? (+$("edit_item_count").value || 0) : (+$("edit_item_qty").value || 0);
  item.p = +$("edit_item_p").value || 0; item.m = +$("edit_item_m").value || 0;
  save(); editingItemId = null;
  logAction("تعديل صنف", "تعديل: " + oldName + " → " + newName, {oldName: oldName, newName: newName}); go();
};

var delItem = function(id) {
  if (!hasPerm('items','delete')) { alert("لا تملك صلاحية الحذف"); return; }
  if (confirm("حذف هذا الصنف؟")) { var x = it(id); S.items = S.items.filter(function(x) { return x.id != id; }); save(); logAction("حذف صنف", "حذف: " + (x ? x.name : '-'), {itemName: x ? x.name : ''}); go(); }
};

function importItemsExcel(input) {
  if (!hasPerm('items','import')) return;
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:'array'});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1});
      var added = 0, updated = 0;
      for (var i = 1; i < rows.length; i++) {
        var r = rows[i]; if (!r || !r[0]) continue;
        var name = String(r[0]).trim(), cat = String(r[1] || "أخرى").trim(), u = String(r[2] || "kg").trim(), p = +r[3] || 0, qty = +r[4] || 0;
        var existing = S.items.find(function(x) { return x.name.toLowerCase() === name.toLowerCase(); });
        if (existing) { existing.p = p; existing.qty = qty; existing.c = cat; existing.u = u; updated++; }
        else if (name) { S.items.push({id: S.seq++, name: name, c: cat, u: u, p: p, m: 5, qty: qty}); added++; }
      }
      save(); alert("تمت إضافة " + added + " صنف جديد وتحديث " + updated + " صنف موجود.");
      logAction("استيراد إكسل", "استيراد " + added + " صنف جديد وتحديث " + updated, {added: added, updated: updated}); go();
    } catch(err) { alert("خطأ: " + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function exportItems() {
  if (!hasPerm('items','export')) return;
  var rows = [['الاسم','التصنيف','الوحدة','الرصيد/العدد','السعر','القيمة','حد الطلب']];
  S.items.forEach(function(x) { var st = stock(x.id), c = cost(x.id); rows.push([x.name, x.c, UN[x.u], st, c, st*c, x.m||0]); });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "الأصناف");
  XLSX.writeFile(wb, "items_" + today() + ".xlsx");
  logAction("تصدير إكسل", "تصدير الأصناف");
}

// ===== الوارد =====
function vIn() {
  if (!hasPerm('in','view')) return '<div class="card">لا تملك صلاحية</div>';
  if (!S.items.length) return '<div class="card">أضف أصنافاً أولاً</div>';
  
  var toolbar = '<div class="toolbar">';
  if (hasPerm('in','import')) toolbar += '<div class="file-input-wrapper"><button class="b-info">استيراد فاتورة إكسل</button><input type="file" accept=".xlsx,.xls" onchange="importInExcel(this)"></div>';
  if (hasPerm('in','export')) toolbar += '<button class="b-ok" onclick="exportIn()">تصدير إكسل</button>';
  toolbar += '</div>';
  
  var inMoves = S.moves.filter(function(m) { return m.t == "in"; }).slice(-20).reverse();
  
  return toolbar + '<div class="card"><h3>فاتورة توريد</h3><div class="g">' +
    '<label>المورد<select id="i_s">' + (S.sup.length ? S.sup.map(function(s) { return '<option value="' + s.id + '">' + E(s.n) + '</option>'; }).join("") : '<option value="">أضف مورداً أولاً</option>') + '</select></label>' +

function addInLine() { var i = +$("i_i").value, q = +$("i_q").value, p = +$("i_p").value; if (!(q > 0)) { alert("كمية صحيحة"); return; } tmp.push({i: i, q: q, p: p >= 0 ? p : cost(i)}); $("i_q").value = ""; $("i_p").value = ""; go(); }

function editInLine(idx) {
  var line = tmp[idx];
  $("i_i").value = line.i;
  $("i_q").value = line.q;
  $("i_p").value = line.p;
  tmp.splice(idx, 1);
  go();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function deleteInLine(idx) {
  if (confirm("حذف هذا السطر؟")) {
    tmp.splice(idx, 1);
    go();
  }
}

function editInMove(moveIdx) {
  if (!hasPerm('in','edit')) { alert("لا تملك صلاحية"); return; }
  var move = S.moves[moveIdx]; if (!move || move.t !== "in") return;
  var newQ = prompt("الكمية الجديدة:", move.q);
  if (newQ === null || isNaN(+newQ)) return;
  var newP = prompt("السعر الجديد:", move.p);
  if (newP === null || isNaN(+newP)) return;
  move.q = +newQ;
  move.p = +newP;
  var x = it(move.i);
  if (x) x.p = +newP;
  save();
  logAction("تعديل وارد", "تعديل وارد: " + nm(move.i), {itemId: move.i});
  go();
}

function deleteInMove(moveIdx) {
  if (!hasPerm('in','delete')) { alert("لا تملك صلاحية"); return; }
  if (confirm("حذف هذه الحركة؟")) {
    var move = S.moves[moveIdx];
    if (move) {
      S.moves.splice(moveIdx, 1);
      save();
      logAction("حذف وارد", "حذف وارد: " + nm(move.i), {itemId: move.i});
      go();
    }
  }
}

function saveIn() {
  if (!hasPerm('in','create')) { alert("لا تملك صلاحية"); return; }
  if (!tmp.length) { alert("أضف صنف"); return; }
  var sid = +$("i_s").value, d = $("i_d").value, inv = $("i_no").value.trim();
  tmp.forEach(function(l) { S.moves.push({i: l.i, d: d, t: "in", q: l.q, p: l.p, sid: sid, inv: inv, b: currentUser ? currentUser.name : "Admin"}); var x = it(l.i); if (x) x.p = l.p; });
  tmp = []; save(); logAction("وارد", "فاتورة توريد - رقم: " + (inv || '-'), {invoice: inv}); go();
}

function importInExcel(input) {
  if (!hasPerm('in','import')) return;
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:'array'});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1});
      var added = 0;
      for (var i = 1; i < rows.length; i++) {
        var r = rows[i]; if (!r) continue;
        var itemName = String(r[0]||'').trim();
        var item = S.items.find(function(x) { return x.name.toLowerCase() === itemName.toLowerCase(); });
        if (item) { var q = +r[1] || 0, p = +r[2] || cost(item.id); if (q > 0) { tmp.push({i: item.id, q: q, p: p}); added++; } }
      }
      alert("تم استيراد " + added + " صنف. راجع القائمة ثم احفظ الفاتورة."); go();
    } catch(err) { alert("خطأ: " + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function exportIn() {
  if (!hasPerm('in','export')) return;
  var rows = [['التاريخ','المورد','الصنف','الكمية','السعر','الإجمالي']];
  S.moves.filter(function(m) { return m.t == "in"; }).forEach(function(m) { rows.push([m.d, (S.sup.find(function(s) { return s.id == m.sid; }) || {}).n || '-', nm(m.i), m.q, m.p, m.q*m.p]); });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "الوارد");
  XLSX.writeFile(wb, "incoming_" + today() + ".xlsx");
  logAction("تصدير إكسل", "تصدير الوارد");
}

function addSup() { if (!hasPerm('sup','create')) { alert("لا تملك صلاحية"); return; } var n = $("s_n").value.trim(); if (!n) return; S.sup.push({id: S.seq++, n: n, p: $("s_p").value.trim(), a: $("s_a").value.trim()}); save(); logAction("إضافة مورد", "إضافة: " + n, {supplierName: n}); go(); }

  var newPhone = prompt("الهاتف الجديد:", s.p || ''); if (newPhone === null) return;
  var newAddr = prompt("العنوان الجديد:", s.a || ''); if (newAddr === null) return;

function delSup(id) { if (!hasPerm('sup','delete')) { alert("لا تملك صلاحية"); return; } if (confirm("حذف؟")) { var s = S.sup.find(function(x) { return x.id == id; }); S.sup = S.sup.filter(function(s) { return s.id != id; }); save(); logAction("حذف مورد", "حذف: " + (s ? s.n : '-'), {supplierName: s ? s.n : ''}); go(); } }

function importSupExcel(input) {

      var ws = wb.Sheets[wb.SheetNames[0]];

}

function issueMenu() {

function importMenuExcel(input) {
  if (!hasPerm('menu','import')) return;
  var file = input.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = new Uint8Array(e.target.result);
      var wb = XLSX.read(data, {type:'array'});
      var ws = wb.Sheets[wb.SheetNames[0]];
      var rows = XLSX.utils.sheet_to_json(ws, {header:1});
      var added = 0;
      for (var i = 1; i < rows.length; i++) {
        var r = rows[i]; if (!r || !r[0]) continue;
        var recipeName = String(r[0]).trim(), price = +r[1] || 0;
        if (recipeName && !S.recipes.some(function(x) { return x.name.toLowerCase() === recipeName.toLowerCase(); })) {
          var lines = [];
          for (var j = 2; j < r.length; j += 3) {
            var itemName = String(r[j]||'').trim(), qty = +r[j+1] || 0, unit = String(r[j+2]||'kg').trim();
            var item = S.items.find(function(x) { return x.name.toLowerCase() === itemName.toLowerCase(); });
            if (item && qty > 0) lines.push({i: item.id, q: qty, unit: unit});
          }
          if (lines.length) { S.recipes.push({id: S.seq++, name: recipeName, price: price, lines: lines}); added++; }
        }
      }
      save(); alert("تم استيراد " + added + " وصفة"); logAction("استيراد وصفات", "استيراد " + added + " وصفة", {count: added}); go();
    } catch(err) { alert("خطأ: " + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function exportMenu() {
  if (!hasPerm('menu','export')) return;
  var rows = [['الطبق','سعر البيع','التكلفة','الربح','المكونات']];
  S.recipes.forEach(function(r) { rows.push([r.name, r.price, rcost(r), r.price-rcost(r), r.lines.map(function(l) { return nm(l.i) + '(' + fx(l.q) + (UN[l.unit]||'') + ')'; }).join(', ')]); });
  var ws = XLSX.utils.aoa_to_sheet(rows);
  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "الوصفات");
  XLSX.writeFile(wb, "recipes_" + today() + ".xlsx");
}

function editSale(id) { if (!hasPerm('sales','edit')) return; editingSaleId = id; go(); }

var saveEditSale = function(id) { var sale = S.sales.find(function(s) { return s.id == id; }); if (!sale) return; var newQ = +$("edit_sa_q").value, newP = +$("edit_sa_p").value; if (!newQ || newQ <= 0) { alert("عدد صحيح"); return; } if (!newP || newP < 0) { alert("سعر صحيح"); return; } var r = S.recipes.find(function(x) { return x.id == sale.rid; }); var oldTot = sale.tot; sale.q = newQ; sale.p = newP; sale.tot = newQ * newP; sale.cost = r ? rcost(r) * newQ : 0; save(); editingSaleId = null; logAction("تعديل مبيعات", "تعديل: " + sale.rn + " - العدد: " + newQ + " - السعر: " + newP, {saleId: id, oldTotal: oldTot, newTotal: sale.tot}); go(); };

var deleteSale = function(id) { if (!hasPerm('sales','delete')) { alert("لا تملك صلاحية"); return; } if (!confirm("حذف هذا البيع؟")) return; var sale = S.sales.find(function(s) { return s.id == id; }); S.sales = S.sales.filter(function(s) { return s.id != id; }); save(); logAction("حذف مبيعات", "حذف: " + (sale ? sale.rn : '-'), {saleId: id}); go(); };

function doSale() {
  if (!hasPerm('sales','create')) { alert("لا تملك صلاحية"); return; }
  var rid = +$("sa_r").value, q = +$("sa_q").value;
  if (!rid || !(q > 0)) { alert("اختر طبقاً وعدد صحيح"); return; }
  var r = S.recipes.find(function(x) { return x.id == rid; });
  if (!r) { alert("الوصفة غير موجودة"); return; }
  var p = $("sa_p").value !== "" ? +$("sa_p").value : r.price;
  var c = rcost(r) * q, ded = $("sa_ded").checked;
  
  if (ded) {
    for (var li = 0; li < r.lines.length; li++) {
      var l = r.lines[li];
      var item = it(l.i);
      if (!item) { alert("المكون غير موجود: " + nm(l.i)); return; }
      var baseUnit = item.u;
      var recipeUnit = l.unit || baseUnit;
      var deductQty = l.q * q;
      
      var deductInGrams = deductQty;
      var stockInGrams = stock(l.i);
      
      if (recipeUnit === 'kg' && baseUnit === 'g') {
        deductInGrams = deductQty * 1000;
      } else if (recipeUnit === 'g' && baseUnit === 'kg') {
        stockInGrams = stock(l.i) * 1000;
      }
      
      if (deductInGrams > stockInGrams) {
        alert("الرصيد غير كافٍ للصنف: " + nm(l.i));
        return;
      }
    }
    
    for (var li2 = 0; li2 < r.lines.length; li2++) {
      var l2 = r.lines[li2];
      var item2 = it(l2.i);
      var baseUnit2 = item2.u;
      var recipeUnit2 = l2.unit || baseUnit2;
      var deductQty2 = l2.q * q;
      
      if (recipeUnit2 === 'kg' && baseUnit2 === 'g') {
        deductQty2 = deductQty2 * 1000;
      } else if (recipeUnit2 === 'g' && baseUnit2 === 'kg') {
        deductQty2 = deductQty2 / 1000;
      }
      
      S.moves.push({
        i: l2.i, d: today(), t: "out", q: -deductQty2,
        r: "بيع: " + r.name + " (" + q + " حصة)",
        n: "خصم " + fx(l2.q * q) + " " + (UN[recipeUnit2]||recipeUnit2) + " من " + nm(l2.i),
        b: currentUser ? currentUser.name : "Admin"
      });
    }
  }
  
  S.sales.push({id: S.seq++, d: today(), rid: rid, rn: r.name, q: q, p: p, tot: p * q, cost: c, b: currentUser ? currentUser.name : "Admin"});
  save();
  logAction("بيع", "بيع " + q + " حصة من " + r.name + " - السعر: " + p + " - الإجمالي: " + $f(p * q), {dish: r.name, qty: q, total: p * q});
  go();
}

function genRep() {
  var fd = function(a) { var r = a.slice(); if (rf) r = r.filter(function(x) { return x.d >= rf; }); if (rto) r = r.filter(function(x) { return x.d <= rto; }); return r; };
  if (rt == "items") return tbl(['الصنف','التصنيف','الوحدة','الرصيد','السعر','القيمة'], S.items.map(function(x) { var st = stock(x.id), c = cost(x.id); return [E(x.name), E(x.c), UN[x.u], fx(st), $f(c), $f(st * c)]; }));
  if (rt == "in") { var l = fd(S.moves.filter(function(m) { return m.t == "in"; })); return tbl(['التاريخ','الصنف','الكمية','السعر','الإجمالي','المورد'], l.map(function(m) { return [m.d, nm(m.i), fx(m.q), $f(m.p), $f(m.q * m.p), E((S.sup.find(function(s) { return s.id == m.sid; }) || {}).n || "-")]; })); }
  if (rt == "out") { var l = fd(S.moves.filter(function(m) { return m.t == "out"; })); return tbl(['التاريخ','الصنف','الكمية','الجهة'], l.map(function(m) { return [m.d, nm(m.i), fx(Math.abs(m.q)), E(m.r || "-")]; })); }
  if (rt == "sales") { var l = fd(S.sales); var r = l.reduce(function(a, s) { return a + s.tot; }, 0), c = l.reduce(function(a, s) { return a + s.cost; }, 0); return '<p><b>الإيراد: ' + $f(r) + ' | التكلفة: ' + $f(c) + ' | الصافي: ' + $f(r - c) + '</b></p>' + tbl(['التاريخ','الطبق','العدد','السعر','الإجمالي'], l.map(function(s) { return [s.d, E(s.rn), s.q, $f(s.p), $f(s.tot)]; })); }
  if (rt == "sup") return tbl(['المورد','المشتريات','المدفوع','المستحق'], S.sup.map(function(s) { var p = S.moves.filter(function(m) { return m.t == "in" && m.sid == s.id; }).reduce(function(a, m) { return a + m.q * m.p; }, 0); var d = S.pay.filter(function(x) { return x.sid == s.id; }).reduce(function(a, x) { return a + x.a; }, 0); return [E(s.n), $f(p), $f(d), '<b>' + $f(p - d) + '</b>']; }));
  if (rt == "menu") { var ds = Object.keys(S.menu).sort(); var rows = [], tc = 0, tr = 0; ds.forEach(function(d) { S.menu[d].forEach(function(m) { var r = S.recipes.find(function(x) { return x.id == m.rid; }); if (!r) return; var c = rcost(r) * m.q, rv = r.price * m.q; tc += c; tr += rv; rows.push([d, E(r.name), m.q, $f(c), $f(rv)]); }); }); return '<p><b>التكلفة: ' + $f(tc) + ' | الإيراد: ' + $f(tr) + ' | الربح: ' + $f(tr - tc) + '</b></p>' + tbl(['التاريخ','الطبق','الحصص','التكلفة','الإيراد'], rows); }
  if (rt == "emp") { var l = fd(S.emp_meals); return '<p><b>إجمالي الخصومات: ' + $f(l.reduce(function(a, m) { return a + m.tot; }, 0)) + '</b></p>' + tbl(['التاريخ','الموظف','النوع','العدد','السعر','الإجمالي'], l.map(function(m) { var e = S.employees.find(function(x) { return x.id == m.emp_id; }) || {}; return [m.d, E(e.name || "-"), E(m.mealType || "-"), m.q, $f(m.p), '<b>' + $f(m.tot) + '</b>']; })); }
  if (rt == "count") { var l = fd(S.moves.filter(function(m) { return m.t == "adj"; })); return tbl(['التاريخ','الصنف','الكمية','ملاحظة'], l.map(function(m) { return [m.d, nm(m.i), fx(m.q), E(m.n || "-")]; })); }
  return "";
}

  if (!hasPerm('users','view')) { alert("لا تملك صلاحية"); return; }
  db.collection('users').get().then(function(snap) {
    var us = snap.docs.map(function(d) { var data = d.data(); data.id = d.id; return data; });
    var html = '<div class="card"><h3>إدارة المستخدمين</h3>';
    if (hasPerm('users','create')) {
      html += '<div class="card"><h3>إضافة مستخدم جديد</h3><div class="g">' +
        '<label>الاسم<input id="nu_name"></label><label>البريد<input id="nu_email" type="email"></label>' +
        '<label>كلمة المرور<input id="nu_pass" type="password"></label>' +
        '<label>الدور<select id="nu_role">' + Object.keys(ROLES).map(function(k) { return '<option value="' + k + '">' + ROLES[k].name + '</option>'; }).join("") + '</select></label></div>' +
        '<button class="b" onclick="createNewUser()">إنشاء المستخدم</button></div>';
    }
    html += '<h3>المستخدمون الحاليون</h3>' + tbl(['الاسم','البريد','الدور','الحالة','إجراء'], us.map(function(u) {
      var sb = u.status === 'active' ? '<span class="tg ok">نشط</span>' : u.status === 'pending' ? '<span class="tg warn">بانتظار</span>' : '<span class="tg bad">موقوف</span>';
      var actions = '';
      if (hasPerm('users','edit')) actions += '<button class="b-edit" onclick="editUserPerms(\'' + u.id + '\')">الصلاحيات</button> ';
      if (u.status === 'pending' && hasPerm('users','edit')) actions += '<button class="b" onclick="activateUser(\'' + u.id + '\')">تفعيل</button> ';
      if (u.status === 'active' && hasPerm('users','edit')) actions += '<button class="r" onclick="blockUser(\'' + u.id + '\')">إيقاف</button> ';
      if (u.status === 'blocked' && hasPerm('users','edit')) actions += '<button class="b" onclick="activateUser(\'' + u.id + '\')">تفعيل</button> ';
      if (u.uid !== currentUser.uid && hasPerm('users','delete')) actions += '<button class="r" onclick="deleteUser(\'' + u.id + '\')">حذف</button>';
      return [E(u.name||"-"), E(u.email), ROLES[u.role] ? ROLES[u.role].name : u.role, sb, actions || '-'];
    })) + '</div><div id="permsEditor"></div><button class="b" onclick="go()" style="margin-top:15px">إغلاق</button></div>';
    $("view").innerHTML = html;
  }).catch(function(e) { alert("خطأ: " + e.message); });
};

var editUserPerms = function(uid) {
  if (!hasPerm('users','edit')) { alert("لا تملك صلاحية"); return; }
  db.collection('users').doc(uid).get().then(function(userDoc) {
    var user = userDoc.data(); if (!user) return;
    var perms = user.permissions || JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS[user.role] || DEFAULT_ROLE_PERMS.viewer));
    var matrixHtml = '<div class="card" style="background:#f0f9ff"><h3>صلاحيات المستخدم: ' + E(user.name||'') + ' (' + E(user.email) + ')</h3>' +
      '<p style="color:#64748b;font-size:13px">حدد الصلاحيات الدقيقة لكل قسم. الدور الحالي: <b>' + (ROLES[user.role] ? ROLES[user.role].name : user.role) + '</b></p>' +
      '<div class="perm-matrix"><div class="header">القسم</div>';
    Object.keys(PERM_TYPES).forEach(function(pk) { matrixHtml += '<div class="header">' + PERM_TYPES[pk] + '</div>'; });
    Object.keys(SECTIONS).forEach(function(sk) {
      var secName = SECTIONS[sk];
      var secPerms = perms[sk] || {};
      matrixHtml += '<div class="section-name">' + secName + '</div>';
      Object.keys(PERM_TYPES).forEach(function(permKey) { var enabled = secPerms[permKey] === true; matrixHtml += '<label><input type="checkbox" data-section="' + sk + '" data-perm="' + permKey + '" ' + (enabled?'checked':'') + '></label>'; });
    });
    matrixHtml += '</div><div style="margin-top:15px;display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="b b-ok" onclick="saveUserPerms(\'' + uid + '\')">حفظ الصلاحيات</button>' +
      '<button class="b-info" onclick="resetPermsToRole(\'' + uid + '\',\'' + user.role + '\')">إعادة للدور الافتراضي</button>' +
      '<button class="r" onclick="showUsers()">إلغاء</button></div></div>';
    $("permsEditor").innerHTML = matrixHtml;
    $("permsEditor").scrollIntoView({behavior: 'smooth'});
  });
};

var saveUserPerms = function(uid) {
  var checkboxes = document.querySelectorAll('#permsEditor input[type=checkbox]');
  var newPerms = {};
  checkboxes.forEach(function(cb) { var sec = cb.dataset.section; var perm = cb.dataset.perm; if (!newPerms[sec]) newPerms[sec] = {}; newPerms[sec][perm] = cb.checked; });
  db.collection('users').doc(uid).update({permissions: newPerms}).then(function() {
    alert("تم حفظ الصلاحيات بنجاح!");
    logAction("تغيير صلاحية", "تعديل صلاحيات مستخدم", {targetUser: uid});
    showUsers();
  });
};

var resetPermsToRole = function(uid, role) {
  if (!confirm("إعادة الصلاحيات للوضع الافتراضي للدور؟")) return;
  var defaultPerms = JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS[role] || DEFAULT_ROLE_PERMS.viewer));
  db.collection('users').doc(uid).update({permissions: defaultPerms, role: role}).then(function() {
    alert("تم إعادة الصلاحيات للدور: " + (ROLES[role] ? ROLES[role].name : role));
    showUsers();
  });
};

var createNewUser = function() {
  if (!hasPerm('users','create')) { alert("لا تملك صلاحية"); return; }
  var n = $("nu_name").value.trim(), e = $("nu_email").value.trim(), p = $("nu_pass").value, r = $("nu_role").value;
  if (!n || !e || !p) { alert("أكمل الحقول"); return; }
  auth.createUserWithEmailAndPassword(e, p).then(function(c) {
    var defaultPerms = JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS[r] || DEFAULT_ROLE_PERMS.viewer));
    return db.collection('users').doc(c.user.uid).set({ email: e, name: n, role: r, status: 'active', permissions: defaultPerms, createdAt: new Date().toISOString() });
  }).then(function() {
    alert("تم إنشاء: " + n); logAction("إنشاء مستخدم", "إنشاء: " + n + " (" + e + ") - الدور: " + (ROLES[r] ? ROLES[r].name : r), {userName: n, role: r});
    showUsers();
  }).catch(function(e) { alert(e.message); });
};

var activateUser = function(u) { if (!hasPerm('users','edit')) return; db.collection('users').doc(u).update({status: 'active'}).then(function() { logAction("تفعيل مستخدم", "تفعيل حساب"); showUsers(); }); };
var blockUser = function(u) { if (!hasPerm('users','edit')) return; if (confirm("إيقاف؟")) { db.collection('users').doc(u).update({status: 'blocked'}).then(function() { logAction("إيقاف مستخدم", "إيقاف حساب"); showUsers(); }); } };
var deleteUser = function(u) { if (!hasPerm('users','delete')) return; if (confirm("حذف؟")) { db.collection('users').doc(u).update({status: 'deleted'}).then(function() { logAction("حذف مستخدم", "حذف حساب"); showUsers(); }); } };

// ===== تشغيل النظام =====
auth.onAuthStateChanged(function(user) {
  if (user) {
    loadUserData(user.uid).catch(function(e) { console.error('loadUserData error:', e); $("loading").innerHTML = "خطأ: " + e.message; });
  } else {
    $("loginScreen").style.display = "flex";
    $("app").style.display = "none";
    $("loading").style.display = "none";
  }
});
</script>
</body>
</html>
