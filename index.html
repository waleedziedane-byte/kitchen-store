function hasPerm(section, permType) {
  // إذا لم تكن الصلاحيات محملة، افترض أن المستخدم مدير (صلاحيات كاملة)
  if (!userPermissions) {
    console.log('⚠️ userPermissions غير محملة - السماح بالوصول');

  var sp = userPermissions[section];
  if (!sp) {
    console.log('⚠️ لا توجد صلاحيات للقسم:', section, '- السماح بالوصول');
    return true;
  }
  return sp[permType] === true;
}

function selectImportSection(section){
  var options=document.querySelectorAll('.import-option');
  options.forEach(function(opt){opt.classList.remove('selected');});
  event.currentTarget.classList.add('selected');
  var file=window._importFile;if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1});
      var preview='<h4>معاينة البيانات ('+(rows.length-1)+' صف):</h4>';
      preview+='<div style="max-height:200px;overflow-y:auto;border:1px solid #e2e8f0;border-radius:8px;padding:10px;margin:10px 0">';
      preview+='<table style="width:100%;font-size:12px"><tr>';
      if(rows[0]){rows[0].forEach(function(cell){preview+='<th>'+(cell||'')+'</th>';});}
      preview+='</tr>';
      for(var i=1;i<Math.min(rows.length,6);i++){preview+='<tr>';rows[i].forEach(function(cell){preview+='<td>'+(cell||'')+'</td>';});preview+='</tr>';}
      if(rows.length>6){preview+='<tr><td colspan="'+(rows[0]?rows[0].length:1)+'" style="text-align:center;color:#64748b">... و '+(rows.length-6)+' صف آخر</td></tr>';}
      preview+='</table></div>';
      preview+='<button class="b b-ok" onclick="confirmImport(\''+section+'\')" style="width:100%;margin-top:10px">تأكيد الاستيراد في '+SECTIONS[section]+'</button>';
      $('importPreview').innerHTML=preview;
    }catch(err){$('importPreview').innerHTML='<div style="color:#991b1b;padding:10px">خطأ في قراءة الملف: '+err.message+'</div>';}
  };
  reader.readAsArrayBuffer(file);
}

function confirmImport(section){
  var file=window._importFile;if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=new Uint8Array(e.target.result);
      var wb=XLSX.read(data,{type:'array'});
      var ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1});
      var count=0;
      if(section==='items'){
        for(var i=1;i<rows.length;i++){var r=rows[i];if(!r||!r[0])continue;var name=String(r[0]).trim(),cat=String(r[1]||"أخرى").trim(),u=String(r[2]||"kg").trim(),p=+r[3]||0,qty=+r[4]||0;if(name&&!S.items.some(function(x){return x.name.toLowerCase()===name.toLowerCase();})){S.items.push({id:S.seq++,name:name,c:cat,u:u,p:p,m:5,qty:qty});count++;}}
      }else if(section==='sup'){
        for(var i=1;i<rows.length;i++){var r=rows[i];if(!r||!r[0])continue;var name=String(r[0]).trim(),phone=String(r[1]||'').trim(),address=String(r[2]||'').trim();if(name&&!S.sup.some(function(s){return s.n.toLowerCase()===name.toLowerCase();})){S.sup.push({id:S.seq++,n:name,p:phone,a:address});count++;}}
      }else if(section==='emp'){
        for(var i=1;i<rows.length;i++){var r=rows[i];if(!r||!r[0])continue;var empName=String(r[0]).trim(),dept=String(r[13]||r[1]||'').trim();if(empName&&!S.employees.some(function(e){return e.name.toLowerCase()===empName.toLowerCase();})){S.employees.push({id:S.seq++,name:empName,dept:dept});count++;}}
      }else if(section==='in'){
        for(var i=1;i<rows.length;i++){var r=rows[i];if(!r)continue;var itemName=String(r[0]||'').trim(),q=+r[1]||0,p=+r[2]||0;var item=S.items.find(function(x){return x.name.toLowerCase()===itemName.toLowerCase();});if(item&&q>0){tmp.push({i:item.id,q:q,p:p});count++;}}
        if(count>0){alert('تم إضافة '+count+' صنف إلى فاتورة التوريد. راجع القائمة ثم احفظ الفاتورة.');go();closeModal();return;}
      }else if(section==='sales'){
        for(var i=1;i<rows.length;i++){var r=rows[i];if(!r||!r[0])continue;var recipeName=String(r[0]).trim(),qty=+r[1]||0,price=+r[2]||0;var recipe=S.recipes.find(function(x){return x.name.toLowerCase()===recipeName.toLowerCase();});if(recipe&&qty>0){var p=price||recipe.price;var c=rcost(recipe)*qty;S.sales.push({id:S.seq++,d:today(),rid:recipe.id,rn:recipe.name,q:qty,p:p,tot:p*qty,cost:c,b:currentUser?currentUser.name:"Admin"});count++;}}
      }else if(section==='menu'){
        for(var i=1;i<rows.length;i++){var r=rows[i];if(!r||!r[0])continue;var recipeName=String(r[0]).trim(),price=+r[1]||0;if(recipeName&&!S.recipes.some(function(x){return x.name.toLowerCase()===recipeName.toLowerCase();})){var lines=[];for(var j=2;j<r.length;j+=3){var itemName=String(r[j]||'').trim(),qty=+r[j+1]||0,unit=String(r[j+2]||'kg').trim();var item=S.items.find(function(x){return x.name.toLowerCase()===itemName.toLowerCase();});if(item&&qty>0)lines.push({i:item.id,q:qty,unit:unit});}if(lines.length){S.recipes.push({id:S.seq++,name:recipeName,price:price,lines:lines});count++;}}}
      }
      save();logAction("استيراد إكسل","استيراد "+count+" عنصر في "+SECTIONS[section],{section:section,count:count});
      alert('✅ تم استيراد '+count+' عنصر في '+SECTIONS[section]);
      closeModal();go();
    }catch(err){alert('خطأ: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

function toggleLoginMode(){loginMode=loginMode==="login"?"register":"login";$("loginBtn").textContent=loginMode==="login"?"تسجيل الدخول":"إنشاء حساب";$("switchText").textContent=loginMode==="login"?"ليس لديك حساب؟":"لديك حساب بالفعل؟";$("switchLink").textContent=loginMode==="login"?"إنشاء حساب جديد":"تسجيل الدخول";$("loginError").style.display="none";}

var doLogin=function(){
  var email=$("loginEmail").value.trim();var pass=$("loginPass").value;
  if(!email||!pass){$("loginError").textContent="أدخل البريد وكلمة المرور";$("loginError").style.display="block";return;}
  $("loginBtn").disabled=true;$("loginBtn").textContent="جاري...";
  if(loginMode==="login"){
    auth.signInWithEmailAndPassword(email,pass).then(function(cred){return loadUserData(cred.user.uid);}).catch(function(e){var errors={'auth/user-not-found':'البريد غير مسجل','auth/wrong-password':'كلمة المرور خاطئة','auth/invalid-email':'بريد غير صحيح'};$("loginError").textContent=errors[e.code]||e.message;$("loginError").style.display="block";}).finally(function(){$("loginBtn").disabled=false;$("loginBtn").textContent="تسجيل الدخول";});
  }else{
    auth.createUserWithEmailAndPassword(email,pass).then(function(cred){return db.collection('users').doc(cred.user.uid).set({email:email,name:email.split('@')[0],role:'viewer',status:'pending',permissions:JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS.viewer)),createdAt:new Date().toISOString()});}).then(function(){$("loginError").textContent="تم إنشاء الحساب. بانتظار موافقة المدير.";$("loginError").style.display="block";return auth.signOut();}).then(function(){toggleLoginMode();}).catch(function(e){var errors={'auth/email-already-in-use':'البريد مستخدم','auth/weak-password':'كلمة المرور ضعيفة (6 أحرف)','auth/invalid-email':'بريد غير صحيح'};$("loginError").textContent=errors[e.code]||e.message;$("loginError").style.display="block";}).finally(function(){$("loginBtn").disabled=false;$("loginBtn").textContent="إنشاء حساب";});
  }
};

// ===== إصلاح جذري: تحميل الصلاحيات مع fallback =====
var loadUserData=function(uid){
  return db.collection('users').doc(uid).get().then(function(userDoc){
    if(!userDoc.exists){
      // أول دخول - إنشاء حساب مدير تلقائياً
      var adminPerms=JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS.admin));
      return db.collection('users').doc(uid).set({
        email:auth.currentUser.email,
        name:auth.currentUser.email.split('@')[0],
        role:'admin',
        status:'active',
        permissions:adminPerms,
        createdAt:new Date().toISOString()
      }).then(function(){
        currentUser={uid:uid,email:auth.currentUser.email,name:auth.currentUser.email.split('@')[0],role:'admin',status:'active'};
        userPermissions=adminPerms;
        console.log('✅ تم إنشاء حساب مدير جديد مع صلاحيات كاملة');
      });
    }
    else{
      var data=userDoc.data();
      if(data.status==='pending'){$("loginError").textContent="حسابك بانتظار موافقة المدير";$("loginError").style.display="block";return auth.signOut();}
      if(data.status==='blocked'){$("loginError").textContent="تم إيقاف حسابك";$("loginError").style.display="block";return auth.signOut();}
      
      currentUser={uid:uid};
      var key;for(key in data){currentUser[key]=data[key];}
      
      // إصلاح مهم: تحميل الصلاحيات بشكل صحيح
      if(data.permissions && typeof data.permissions === 'object' && Object.keys(data.permissions).length > 0){
        userPermissions=data.permissions;
        console.log('✅ تم تحميل الصلاحيات من Firebase');
      }else{
        // إذا لم توجد صلاحيات، استخدم صلاحيات الدور الافتراضية
        var defaultRole=data.role||'admin';
        userPermissions=JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS[defaultRole]||DEFAULT_ROLE_PERMS.admin));
        console.log('️ لم توجد صلاحيات - استخدام صلاحيات افتراضية للدور:', defaultRole);
        
        // تحديث Firebase بالصلاحيات الافتراضية
        db.collection('users').doc(uid).update({
          permissions:userPermissions,
          role:defaultRole
        }).catch(function(e){console.error('Update perms error:',e);});
      }
      
      console.log('👤 المستخدم:', currentUser.name, '| الدور:', currentUser.role);
    }
  }).catch(function(e){
    console.error("خطأ في تحميل المستخدم:",e);
    currentUser={uid:uid,email:auth.currentUser.email,name:"مدير",role:'admin',status:'active'};
    userPermissions=JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS.admin));
  }).then(function(){
    currentRole=currentUser.role||'admin';
    $("loginScreen").style.display="none";
    $("loading").style.display="flex";
    $("usersBtn").style.display='inline-block'; // إظهار زر المستخدمين دائماً
    $("who").textContent=(currentUser.name||'مدير')+' ('+(ROLES[currentRole]?ROLES[currentRole].name:'مدير')+')';
    return ensureDataExists();
  }).then(function(){loadAppData();loadLogs();});
};

var ensureDataExists=function(){return db.collection('kitchen_data').doc('main').get().then(function(doc){if(!doc.exists){return db.collection('kitchen_data').doc('main').set(defaultS);}}).catch(function(e){console.error('ensureData error:',e);});};

function loadAppData(){db.collection('kitchen_data').doc('main').onSnapshot(function(doc){if(doc.exists){var d=doc.data();S={items:d.items||[],moves:d.moves||[],recipes:d.recipes||[],employees:d.employees||[],emp_meals:d.emp_meals||[],sales:d.sales||[],sup:d.sup||[],pay:d.pay||[],menu:d.menu||{},done:d.done||{},seq:d.seq||1,cm:d.cm||"avg",cats:d.cats||defaultS.cats};$("loading").style.display="none";$("app").style.display="block";try{go();}catch(e){console.error('go error:',e);}}},function(error){console.error('Snapshot error:',error);$("loading").innerHTML="خطأ: "+error.message;});}

function loadLogs(){db.collection('audit_log').orderBy('timestamp','desc').limit(500).onSnapshot(function(snap){allLogs=snap.docs.map(function(d){return d.data();});if(tab==='log')go();},function(error){console.error('Logs error:',error);});}

var doLogout=function(){logAction("تسجيل خروج","خروج: "+(currentUser?currentUser.email:''));if(confirm("تسجيل الخروج؟")){auth.signOut().then(function(){location.reload();});}};

function go(){
  try{
    var visibleTabs=getVisibleTabs();var found=false;
    for(var i=0;i<visibleTabs.length;i++){if(visibleTabs[i][0]===tab){found=true;break;}}
    if(!found)tab=visibleTabs.length>0?visibleTabs[0][0]:"rep";
    var navEl=$("nav");if(!navEl)return;
    navEl.innerHTML=visibleTabs.map(function(t){return'<button class="'+(tab==t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';go()">'+t[1]+'</button>';}).join("");
    var viewEl=$("view");if(!viewEl)return;
    
    // إضافة بانر إصلاح إذا لزم الأمر
    var fixBanner='';
    if(!userPermissions || Object.keys(userPermissions).length===0){
      fixBanner='<div class="fix-banner"><div class="icon">⚠️</div><div class="text"><strong>تنبيه:</strong> لم يتم تحميل الصلاحيات بشكل صحيح. اضغط "إصلاح تلقائي" لإضافة صلاحيات المدير.</div><button class="b b-ok" onclick="autoFixPermissions()"> إصلاح تلقائي</button></div>';
    }
    
    if(tab=="items")viewEl.innerHTML=fixBanner+vItems();
    else if(tab=="in")viewEl.innerHTML=fixBanner+vIn();
    else if(tab=="sup")viewEl.innerHTML=fixBanner+vSup();
    else if(tab=="out")viewEl.innerHTML=fixBanner+vOut();
    else if(tab=="menu")viewEl.innerHTML=fixBanner+vMenu();
    else if(tab=="sales")viewEl.innerHTML=fixBanner+vSales();
    else if(tab=="emp")viewEl.innerHTML=fixBanner+vEmp();
    else if(tab=="count")viewEl.innerHTML=fixBanner+vCount();
    else if(tab=="rep")viewEl.innerHTML=fixBanner+vRep();
    else if(tab=="log")viewEl.innerHTML=fixBanner+vLog();
    else viewEl.innerHTML=fixBanner+'<div class="card">مرحباً بك في النظام</div>';
  }catch(e){console.error('go() error:',e);var viewEl=$("view");if(viewEl)viewEl.innerHTML='<div class="card"><h3>خطأ</h3><p>'+e.message+'</p><button class="b" onclick="go()">إعادة المحاولة</button></div>';}
}

// ===== دالة الإصلاح التلقائي =====
function autoFixPermissions(){
  if(!currentUser || !currentUser.uid){alert('يجب تسجيل الدخول أولاً');return;}
  var adminPerms=JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS.admin));
  db.collection('users').doc(currentUser.uid).update({
    permissions:adminPerms,
    role:'admin',
    status:'active'
  }).then(function(){
    userPermissions=adminPerms;
    currentRole='admin';
    alert('✅ تم إصلاح الصلاحيات! الآن لديك صلاحيات مدير كاملة.');
    $("who").textContent=(currentUser.name||'مدير')+' (مدير)';
    go();
  }).catch(function(e){alert('خطأ: '+e.message);});
}

function vItems(){

  var catsList=[];var seen={};S.cats.forEach(function(c){if(!seen[c]){seen[c]=true;catsList.push(c);}});S.items.forEach(function(x){if(!seen[x.c]){seen[x.c]=true;catsList.push(x.c);}});
  var toolbar='<div class="toolbar">';

  if(hasPerm('items','export'))toolbar+='<button class="b-ok" onclick="exportItems()">تصدير إكسل</button>';

function vIn(){

function showEditMenuDishModal(idx){if(!hasPerm('menu','edit')){alert('لا تملك صلاحية');return;}var menuList=S.menu[md]||[];var dish=menuList[idx];if(!dish)return;var r=S.recipes.find(function(x){return x.id==dish.rid;});var html='<div class="g"><label>الطبق<input value="'+E(r?r.name:'')+'" disabled></label><label>عدد الحصص<input id="edit_menu_q" type="number" min="1" value="'+dish.q+'"></label></div>';showModal('تعديل طبق في المنيو',html,[{label:'إلغاء',class:'r',onclick:'closeModal()'},{label:'حفظ التعديلات',class:'b b-ok',onclick:'saveEditMenuDish('+idx+')'}]);}

function delMenuDish(idx){if(!hasPerm('menu','delete')){alert('لا تملك صلاحية');return;}if(confirm('حذف هذا الطبق من المنيو؟')){S.menu[md].splice(idx,1);if(!S.menu[md].length)delete S.menu[md];save();go();}}

function issueMenu(){if(!hasPerm('menu','create')){alert('لا تملك صلاحية');return;}var list=S.menu[md]||[];if(!list.length)return;if(S.done[md]&&!confirm('تم الصرف. مرة أخرى؟'))return;list.forEach(function(m){var r=S.recipes.find(function(x){return x.id==m.rid;});if(!r)return;r.lines.forEach(function(l){var u=l.unit||(it(l.i)?it(l.i).u:'kg');var req=(u==='g')?(l.q/1000)*m.q:l.q*m.q;S.moves.push({i:l.i,d:md,t:'out',q:-req,r:'منيو '+md+': '+r.name,b:currentUser?currentUser.name:'Admin'});});});S.done[md]=true;save();logAction('صرف منيو','صرف منيو يوم '+md,{menuDate:md});alert('تم الصرف');go();}

function exportMenu(){if(!hasPerm('menu','export'))return;var rows=[['الطبق','سعر البيع','التكلفة','الربح','المكونات']];S.recipes.forEach(function(r){rows.push([r.name,r.price,rcost(r),r.price-rcost(r),r.lines.map(function(l){return nm(l.i)+'('+fx(l.q)+(UN[l.unit]||'')+')';}).join(', ')]);});var ws=XLSX.utils.aoa_to_sheet(rows);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'الوصفات');XLSX.writeFile(wb,'recipes_'+today()+'.xlsx');}

// ===== المبيعات =====
function vSales(){
  if(!hasPerm('sales','view'))return'<div class="card">لا تملك صلاحية</div>';
  if(!S.recipes.length)return'<div class="card">أضف وصفات أولاً</div>';
  var ts=S.sales.filter(function(s){return s.d==today();});var rev=ts.reduce(function(a,s){return a+s.tot;},0),cst=ts.reduce(function(a,s){return a+s.cost;},0);
  var toolbar='<div class="toolbar">';
  if(hasPerm('sales','create'))toolbar+='<button class="b" onclick="showAddSaleModal()">+ تسجيل بيع</button>';
  if(hasPerm('sales','import'))toolbar+='<div class="file-input-wrapper"><button class="b-info">استيراد مبيعات</button><input type="file" accept=".xlsx,.xls" onchange="handleImport(this)"></div>';
  if(hasPerm('sales','export'))toolbar+='<button class="b-ok" onclick="exportSales()">تصدير إكسل</button>';
  toolbar+='</div>';
  return toolbar+'<div class="card"><h3>ملخص اليوم ('+today()+')</h3><p><b>الإيراد: '+$f(rev)+' | التكلفة: '+$f(cst)+' | الصافي: <span style="color:'+clr(rev-cst)+'">'+$f(rev-cst)+'</span></b></p><h4>المبيعات</h4>'+tbl(['التاريخ','الطبق','العدد','السعر','الإجمالي','التكلفة','الصافي','إجراء'],S.sales.slice().reverse().map(function(s){var actions='';if(hasPerm('sales','edit'))actions+='<button class="btn-edit" onclick="showEditSaleModal('+s.id+')">تعديل</button>';if(hasPerm('sales','delete'))actions+='<button class="btn-del" onclick="deleteSale('+s.id+')">حذف</button>';return[s.d,E(s.rn),s.q,$f(s.p),$f(s.tot),$f(s.cost),'<b style="color:'+clr(s.tot-s.cost)+'">'+$f(s.tot-s.cost)+'</b>',actions||'-'];}))+'</div>';
}

function showAddSaleModal(){var html='<div class="g"><label>الطبق<select id="modal_sale_r">'+S.recipes.map(function(r){return'<option value="'+r.id+'">'+E(r.name)+' - '+$f(r.price)+'</option>';}).join('')+'</select></label><label>العدد<input id="modal_sale_q" type="number" min="1" value="1"></label><label>السعر<input id="modal_sale_p" type="number" step="any" placeholder="تلقائي"></label><label style="flex-direction:row;align-items:center;gap:6px"><input id="modal_sale_ded" type="checkbox" checked> خصم من المخزن</label></div>';showModal('تسجيل بيع جديد',html,[{label:'إلغاء',class:'r',onclick:'closeModal()'},{label:'تسجيل البيع',class:'b b-ok',onclick:'saveNewSale()'}]);}

function saveNewSale(){
  if(!hasPerm('sales','create')){alert('لا تملك صلاحية');return;}
  var rid=+$('modal_sale_r').value,q=+$('modal_sale_q').value;if(!rid||!(q>0)){alert('اختر طبقاً وعدد صحيح');return;}
  var r=S.recipes.find(function(x){return x.id==rid;});if(!r){alert('الوصفة غير موجودة');return;}
  var p=$('modal_sale_p').value!==''?+$('modal_sale_p').value:r.price;
  var c=rcost(r)*q,ded=$('modal_sale_ded').checked;
  if(ded){
    for(var li=0;li<r.lines.length;li++){var l=r.lines[li];var item=it(l.i);if(!item){alert('المكون غير موجود: '+nm(l.i));return;}var baseUnit=item.u;var recipeUnit=l.unit||baseUnit;var deductQty=l.q*q;var deductInGrams=deductQty;var stockInGrams=stock(l.i);if(recipeUnit==='kg'&&baseUnit==='g'){deductInGrams=deductQty*1000;}else if(recipeUnit==='g'&&baseUnit==='kg'){stockInGrams=stock(l.i)*1000;}if(deductInGrams>stockInGrams){alert('الرصيد غير كافٍ للصنف: '+nm(l.i));return;}}
    for(var li2=0;li2<r.lines.length;li2++){var l2=r.lines[li2];var item2=it(l2.i);var baseUnit2=item2.u;var recipeUnit2=l2.unit||baseUnit2;var deductQty2=l2.q*q;if(recipeUnit2==='kg'&&baseUnit2==='g'){deductQty2=deductQty2*1000;}else if(recipeUnit2==='g'&&baseUnit2==='kg'){deductQty2=deductQty2/1000;}S.moves.push({i:l2.i,d:today(),t:'out',q:-deductQty2,r:'بيع: '+r.name+' ('+q+' حصة)',n:'خصم '+fx(l2.q*q)+' '+(UN[recipeUnit2]||recipeUnit2)+' من '+nm(l2.i),b:currentUser?currentUser.name:'Admin'});}
  }
  S.sales.push({id:S.seq++,d:today(),rid:rid,rn:r.name,q:q,p:p,tot:p*q,cost:c,b:currentUser?currentUser.name:'Admin'});save();logAction('بيع','بيع '+q+' حصة من '+r.name+' - السعر: '+p+' - الإجمالي: '+$f(p*q),{dish:r.name,qty:q,total:p*q});closeModal();go();
}

function showEditSaleModal(id){var sale=S.sales.find(function(s){return s.id==id;});if(!sale)return;var html='<div class="g"><label>الطبق<input value="'+E(sale.rn)+'" disabled></label><label>التاريخ<input value="'+sale.d+'" disabled></label><label>العدد<input id="edit_sale_q" type="number" min="1" value="'+sale.q+'"></label><label>السعر<input id="edit_sale_p" type="number" step="any" value="'+sale.p+'"></label></div>';showModal('تعديل البيع #'+sale.id,html,[{label:'إلغاء',class:'r',onclick:'closeModal()'},{label:'حفظ التعديلات',class:'b b-ok',onclick:'saveEditSale('+id+')'}]);}
function saveEditSale(id){var sale=S.sales.find(function(s){return s.id==id;});if(!sale)return;var newQ=+$('edit_sale_q').value,newP=+$('edit_sale_p').value;if(!newQ||newQ<=0){alert('عدد صحيح');return;}if(!newP||newP<0){alert('سعر صحيح');return;}var r=S.recipes.find(function(x){return x.id==sale.rid;});var oldTot=sale.tot;sale.q=newQ;sale.p=newP;sale.tot=newQ*newP;sale.cost=r?rcost(r)*newQ:0;save();logAction('تعديل مبيعات','تعديل: '+sale.rn+' - العدد: '+newQ+' - السعر: '+newP,{saleId:id,oldTotal:oldTot,newTotal:sale.tot});closeModal();go();}
var deleteSale=function(id){if(!hasPerm('sales','delete')){alert('لا تملك صلاحية');return;}if(!confirm('حذف هذا البيع؟'))return;var sale=S.sales.find(function(s){return s.id==id;});S.sales=S.sales.filter(function(s){return s.id!=id;});save();logAction('حذف مبيعات','حذف: '+(sale?sale.rn:'-'),{saleId:id});go();};

function exportSales(){if(!hasPerm('sales','export'))return;var rows=[['التاريخ','الطبق','العدد','السعر','الإجمالي','التكلفة','الصافي']];S.sales.forEach(function(s){rows.push([s.d,s.rn,s.q,s.p,s.tot,s.cost,s.tot-s.cost]);});var ws=XLSX.utils.aoa_to_sheet(rows);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'المبيعات');XLSX.writeFile(wb,'sales_'+today()+'.xlsx');logAction('تصدير إكسل','تصدير المبيعات');}

function showAddEmpModal(){var html='<div class="g"><label>اسم الموظف<input id="modal_emp_name"></label><label>القسم/الإدارة<input id="modal_emp_dept"></label></div>';showModal('إضافة موظف جديد',html,[{label:'إلغاء',class:'r',onclick:'closeModal()'},{label:'إضافة',class:'b b-ok',onclick:'saveNewEmp()'}]);}

var showUsers=function(){
  if(!hasPerm('users','view')){alert('لا تملك صلاحية');return;}
  db.collection('users').get().then(function(snap){
    var us=snap.docs.map(function(d){var data=d.data();data.id=d.id;return data;});
    
    var html='<div class="card"><h3>إدارة المستخدمين</h3>';
    
    // زر إضافة مستخدم جديد
    if(hasPerm('users','create')){
      html+='<div class="card" style="background:#f0f9ff"><h3> إضافة مستخدم جديد</h3>';
      html+='<div class="g">';
      html+='<label>الاسم<input id="nu_name"></label>';
      html+='<label>البريد<input id="nu_email" type="email"></label>';
      html+='<label>كلمة المرور<input id="nu_pass" type="password"></label>';
      html+='<label>الدور<select id="nu_role">';
      Object.keys(ROLES).forEach(function(k){
        html+='<option value="'+k+'">'+ROLES[k].name+'</option>';
      });
      html+='</select></label></div>';
      html+='<button class="b b-ok" onclick="createNewUser()">إنشاء المستخدم</button></div>';
    }
    
    // زر إصلاح تلقائي لجميع المستخدمين
    html+='<div class="card" style="background:#fef3c7"><h3>🔧 إصلاح المستخدمين</h3>';
    html+='<p style="font-size:13px;color:#92400e;margin-bottom:10px">اضغط لإضافة صلاحيات افتراضية لجميع المستخدمين الذين لا توجد لديهم صلاحيات</p>';
    html+='<button class="b b-ok" onclick="fixAllUsersPermissions()">إصلاح جميع المستخدمين</button></div>';
    
    // جدول المستخدمين
    html+='<h3>المستخدمون الحاليون ('+us.length+')</h3>';
    html+='<div class="tw"><table><thead><tr>';
    html+='<th>الاسم</th><th>البريد</th><th>الدور</th><th>الحالة</th><th>إجراء</th>';
    html+='</tr></thead><tbody>';
    
    if(us.length===0){
      html+='<tr><td colspan="5">لا يوجد مستخدمون</td></tr>';
    }else{
      us.forEach(function(u){
        // إصلاح عرض الدور
        var roleName='غير محدد';
        if(u.role && ROLES[u.role]){
          roleName=ROLES[u.role].name;
        }else if(u.role){
          roleName=u.role;
        }
        
        // إصلاح عرض الحالة
        var statusBadge='';
        if(u.status==='active'){
          statusBadge='<span class="tg ok">نشط</span>';
        }else if(u.status==='pending'){
          statusBadge='<span class="tg warn">بانتظار</span>';
        }else if(u.status==='blocked'){
          statusBadge='<span class="tg bad">موقوف</span>';
        }else{
          statusBadge='<span class="tg info">غير محدد</span>';
        }
        
        // أزرار الإجراءات
        var actions='';
        if(hasPerm('users','edit')){
          actions+='<button class="btn-edit" onclick="editUserPerms(\''+u.id+'\')">⚙️ الصلاحيات</button> ';
        }
        if(u.status==='pending'&&hasPerm('users','edit')){
          actions+='<button class="b-ok" style="padding:6px 10px;font-size:11px" onclick="activateUser(\''+u.id+'\')">✅ تفعيل</button> ';
        }
        if(u.status==='active'&&hasPerm('users','edit')){
          actions+='<button class="r" onclick="blockUser(\''+u.id+'\')">🚫 إيقاف</button> ';
        }
        if(u.status==='blocked'&&hasPerm('users','edit')){
          actions+='<button class="b-ok" style="padding:6px 10px;font-size:11px" onclick="activateUser(\''+u.id+'\')">✅ تفعيل</button> ';
        }
        if(u.uid!==currentUser.uid&&hasPerm('users','delete')){
          actions+='<button class="btn-del" onclick="deleteUser(\''+u.id+'\')">🗑️ حذف</button>';
        }
        if(!actions)actions='-';
        
        html+='<tr>';
        html+='<td>'+E(u.name||'-')+'</td>';
        html+='<td>'+E(u.email||'-')+'</td>';
        html+='<td><span class="tg info">'+roleName+'</span></td>';
        html+='<td>'+statusBadge+'</td>';
        html+='<td>'+actions+'</td>';
        html+='</tr>';
      });
    }
    
    html+='</tbody></table></div>';
    html+='<div id="permsEditor"></div>';
    html+='<button class="b" onclick="go()" style="margin-top:15px">إغلاق</button></div>';
    
    $('view').innerHTML=html;
  }).catch(function(e){alert('خطأ في تحميل المستخدمين: '+e.message);});
};

// ===== دالة إصلاح جميع المستخدمين =====
function fixAllUsersPermissions(){
  if(!confirm('سيتم إضافة صلاحيات افتراضية لجميع المستخدمين الذين لا توجد لديهم صلاحيات. متابعة؟'))return;
  db.collection('users').get().then(function(snap){
    var promises=[];
    snap.docs.forEach(function(doc){
      var data=doc.data();
      if(!data.permissions || Object.keys(data.permissions).length===0){
        var defaultRole=data.role||'admin';
        var defaultPerms=JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS[defaultRole]||DEFAULT_ROLE_PERMS.admin));
        var promise=db.collection('users').doc(doc.id).update({
          permissions:defaultPerms,
          role:defaultRole,
          status:data.status||'active'
        });
        promises.push(promise);
      }
    });
    return Promise.all(promises);
  }).then(function(){
    alert('✅ تم إصلاح صلاحيات جميع المستخدمين!');
    showUsers();
  }).catch(function(e){
    alert('خطأ: '+e.message);
  });
}

var editUserPerms=function(uid){
  if(!hasPerm('users','edit')){alert('لا تملك صلاحية');return;}
  db.collection('users').doc(uid).get().then(function(userDoc){
    var user=userDoc.data();if(!user)return;
    var perms=user.permissions||JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS[user.role]||DEFAULT_ROLE_PERMS.viewer));
    var matrixHtml='<div class="card" style="background:#f0f9ff"><h3>صلاحيات المستخدم: '+E(user.name||'')+' ('+E(user.email)+')</h3>';
    matrixHtml+='<p style="color:#64748b;font-size:13px">الدور الحالي: <b>'+(ROLES[user.role]?ROLES[user.role].name:user.role)+'</b></p>';
    matrixHtml+='<div class="perm-matrix"><div class="header">القسم</div>';
    Object.keys(PERM_TYPES).forEach(function(pk){matrixHtml+='<div class="header">'+PERM_TYPES[pk]+'</div>';});
    Object.keys(SECTIONS).forEach(function(sk){
      var secName=SECTIONS[sk];
      var secPerms=perms[sk]||{};
      matrixHtml+='<div class="section-name">'+secName+'</div>';
      Object.keys(PERM_TYPES).forEach(function(permKey){
        var enabled=secPerms[permKey]===true;
        matrixHtml+='<label><input type="checkbox" data-section="'+sk+'" data-perm="'+permKey+'" '+(enabled?'checked':'')+'></label>';
      });
    });
    matrixHtml+='</div>';
    matrixHtml+='<div style="margin-top:15px;display:flex;gap:10px;flex-wrap:wrap">';
    matrixHtml+='<button class="b b-ok" onclick="saveUserPerms(\''+uid+'\')">حفظ الصلاحيات</button>';
    matrixHtml+='<button class="b-info" onclick="resetPermsToRole(\''+uid+'\',\''+user.role+'\')">إعادة للدور الافتراضي</button>';
    matrixHtml+='<button class="r" onclick="showUsers()">إلغاء</button>';
    matrixHtml+='</div></div>';
    $('permsEditor').innerHTML=matrixHtml;
    $('permsEditor').scrollIntoView({behavior:'smooth'});
  });
};

var saveUserPerms=function(uid){
  var checkboxes=document.querySelectorAll('#permsEditor input[type=checkbox]');
  var newPerms={};
  checkboxes.forEach(function(cb){
    var sec=cb.dataset.section;
    var perm=cb.dataset.perm;
    if(!newPerms[sec])newPerms[sec]={};
    newPerms[sec][perm]=cb.checked;
  });
  db.collection('users').doc(uid).update({permissions:newPerms}).then(function(){
    alert('تم حفظ الصلاحيات بنجاح!');
    logAction('تغيير صلاحية','تعديل صلاحيات مستخدم',{targetUser:uid});
    showUsers();
  });
};

var resetPermsToRole=function(uid,role){
  if(!confirm('إعادة الصلاحيات للوضع الافتراضي للدور؟'))return;
  var defaultPerms=JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS[role]||DEFAULT_ROLE_PERMS.admin));
  db.collection('users').doc(uid).update({permissions:defaultPerms,role:role}).then(function(){
    alert('تم إعادة الصلاحيات للدور: '+(ROLES[role]?ROLES[role].name:role));
    showUsers();
  });
};

var createNewUser=function(){
  if(!hasPerm('users','create')){alert('لا تملك صلاحية');return;}
  var n=$('nu_name').value.trim(),e=$('nu_email').value.trim(),p=$('nu_pass').value,r=$('nu_role').value;
  if(!n||!e||!p){alert('أكمل الحقول');return;}
  auth.createUserWithEmailAndPassword(e,p).then(function(c){
    var defaultPerms=JSON.parse(JSON.stringify(DEFAULT_ROLE_PERMS[r]||DEFAULT_ROLE_PERMS.viewer));
    return db.collection('users').doc(c.user.uid).set({
      email:e,name:n,role:r,status:'active',
      permissions:defaultPerms,
      createdAt:new Date().toISOString()
    });
  }).then(function(){
    alert('تم إنشاء: '+n);
    logAction('إنشاء مستخدم','إنشاء: '+n+' ('+e+') - الدور: '+(ROLES[r]?ROLES[r].name:r),{userName:n,role:r});
    showUsers();
  }).catch(function(e){alert(e.message);});
};

var activateUser=function(u){
  if(!hasPerm('users','edit'))return;
  db.collection('users').doc(u).update({status:'active'}).then(function(){
    logAction('تفعيل مستخدم','تفعيل حساب');
    showUsers();
  });
};
var blockUser=function(u){
  if(!hasPerm('users','edit'))return;
  if(confirm('إيقاف؟')){
    db.collection('users').doc(u).update({status:'blocked'}).then(function(){
      logAction('إيقاف مستخدم','إيقاف حساب');
      showUsers();
    });
  }
};
var deleteUser=function(u){
  if(!hasPerm('users','delete'))return;
  if(confirm('حذف؟')){
    db.collection('users').doc(u).update({status:'deleted'}).then(function(){
      logAction('حذف مستخدم','حذف حساب');
      showUsers();
    });
  }
};

// ===== تشغيل النظام =====
auth.onAuthStateChanged(function(user){if(user){loadUserData(user.uid).catch(function(e){console.error('loadUserData error:',e);$('loading').innerHTML='خطأ: '+e.message;});}else{$('loginScreen').style.display='flex';$('app').style.display='none';$('loading').style.display='none';}});
</script>
