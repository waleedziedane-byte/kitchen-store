function svp(uid){var cbs=document.querySelectorAll('#mc input[type=checkbox]');var np={};cbs.forEach(function(cb){var s=cb.dataset.s,p=cb.dataset.p;if(!np[s])np[s]={};np[s][p]=cb.checked;});db.collection('us').doc(uid).update({p:np}).then(function(){alert('تم حفظ الصلاحيات!');cm();su();});}
function rpr(uid,role){if(confirm('إعادة الصلاحيات للوضع الافتراضي؟')){var dp=JSON.parse(JSON.stringify(DPRM[role]||DPRM.vi));db.collection('us').doc(uid).update({p:dp}).then(function(){alert('تم!');cm();su();});}}

function vl(){if(!hasPerm2('lg','view'))return'<div class="cd">لا تملك صلاحية</div>';var fu=$('lfu')?$('lfu').value:'all',fa=$('lfa')?$('lfa').value:'all',fl=allLogs;if(fu!=='all')fl=fl.filter(function(l){return l.user===fu;});if(fa!=='all')fl=fl.filter(function(l){return l.action===fa;});var users=[],actions=[],su2={},sa={};allLogs.forEach(function(l){if(!su2[l.user]){su2[l.user]=1;users.push(l.user);}if(!sa[l.action]){sa[l.action]=1;actions.push(l.action);}});var gb=function(a){var colors={'تسجيل دخول':'info','تسجيل خروج':'info','إضافة صنف':'ok','حذف صنف':'bad','تعديل صنف':'info','وارد':'ok','صرف':'bad','بيع':'ok','تعديل مبيعات':'info','حذف مبيعات':'bad','إضافة مورد':'ok','حذف مورد':'bad','حفظ وصفة':'info','حذف وصفة':'bad','إضافة للمنيو':'info','صرف منيو':'bad','تسجيل وجبة':'info','حذف وجبة':'bad','تعديل وجبة':'info','إضافة موظف':'ok','حذف موظف':'bad','جرد':'info','إنشاء مستخدم':'info','تغيير صلاحية':'info','تفعيل مستخدم':'ok','إيقاف مستخدم':'bad','حذف مستخدم':'bad','تصدير':'info','استيراد':'ok'};return'<span class="tg '+(colors[a]||'info')+'">'+E(a)+'</span>';};
var t='<div class="tb">';if(hasPerm2('lg','export'))t+='<button class="b" onclick="exl()">تصدير كإكسل</button>';if(hasPerm2('lg','delete'))t+='<button class="r" onclick="clrL()">مسح السجل</button>';t+='</div>';
return '<div class="cd"><h3>سجل الحركات ('+fl.length+' من '+allLogs.length+')</h3><div class="g"><label>تصفية بالمستخدم<select id="lfu" onchange="tb=\'lg\';go()"><option value="all" '+(fu==='all'?'selected':'')+'>كل المستخدمين</option>'+users.map(function(u){return'<option value="'+E(u)+'" '+(fu===u?'selected':'')+'>'+E(u)+'</option>';}).join('')+'</select></label><label>تصفية بنوع الحركة<select id="lfa" onchange="tb=\'lg\';go()"><option value="all" '+(fa==='all'?'selected':'')+'>كل الحركات</option>'+actions.map(function(a){return'<option value="'+E(a)+'" '+(fa===a?'selected':'')+'>'+E(a)+'</option>';}).join('')+'</select></label></div>'+t+tb2(['التاريخ','الوقت','نوع الحركة','المستخدم','البريد','التفاصيل'],fl.map(function(l){return[l.date||'-','<b>'+(l.time||'-')+'</b>',gb(l.action),'<b>'+E(l.user)+'</b>','<small>'+E(l.userEmail||'')+'</small>','<div style="text-align:right;font-size:12px">'+E(l.details||'-')+'</div>'];})))+'</div>';}

function exl(){var rows=[['التاريخ','الوقت','نوع الحركة','المستخدم','البريد','الصلاحية','التفاصيل']];allLogs.forEach(function(l){rows.push([l.date,l.time,l.action,l.user,l.userEmail||'',l.userRole||'',l.details||'']);});var csv=rows.map(function(x){return x.join(',');}).join('\n');var b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='audit_'+td()+'.csv';a.click();}
function clrL(){if(!hasPerm2('lg','delete')){alert('لا تملك صلاحية');return;}if(!confirm('مسح جميع السجلات؟'))return;db.collection('al').get().then(function(s){var b=db.batch();s.docs.forEach(function(d){b.delete(d.ref);});return b.commit();}).then(function(){alert('تم المسح');allLogs=[];go();}).catch(function(e){alert('خطأ: '+e.message);});}
